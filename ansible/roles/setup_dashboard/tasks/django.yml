---

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Create Django group
  ansible.builtin.group:
    name: "{{ django_app_group }}"
    system: true
    state: present

- name: Create Django user
  ansible.builtin.user:
    name: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ django_app_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    mode: "0755"

- name: Create source directory
  ansible.builtin.file:
    path: "{{ django_source_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    mode: "0755"
