- name: Install CA certificate into Debian trust store
  ansible.builtin.copy:
    src: "{{ pki_ca_cert_path }}"
    dest: /usr/local/share/ca-certificates/worms-internal-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "Debian"
  notify: Update CA trust

- name: Install CA certificate into RedHat trust store
  ansible.builtin.copy:
    src: "{{ pki_ca_cert_path }}"
    dest: /etc/pki/ca-trust/source/anchors/worms-internal-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "RedHat"
  notify: Update CA trust

# A handler runs at the end of the play, so a run that fails or is interrupted
# loses it, and the next run finds the file unchanged and never updates the trust
# store: the CA is on disk, and TLS to the internal services still fails.
- name: Check the trust store holds the CA
  ansible.builtin.stat:
    path: /etc/ssl/certs/worms-internal-ca.pem
  register: ca_distribute_trusted
  changed_when: not ca_distribute_trusted.stat.exists
  when: ansible_os_family == "Debian"
  notify: Update CA trust

- name: Update the trust store now, for the tasks that follow
  ansible.builtin.meta: flush_handlers