---

- name: Synchronize Django application
  ansible.posix.synchronize:
    src: "{{ django_local_source }}/"
    dest: "{{ django_source_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
  notify:
    - Restart Django

