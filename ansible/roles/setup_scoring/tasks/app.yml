---
- name: Create application directory
  file:
    path: "{{ flask_app_dir }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: "0755"

- name: Create Flask environment file
  template:
    src: flask.env.j2
    dest: /etc/flask.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart flask

- name: Deploy Flask application
  copy:
    src: app.py
    dest: "{{ flask_app_dir }}/app.py"
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: "0644"
  notify: Restart flask