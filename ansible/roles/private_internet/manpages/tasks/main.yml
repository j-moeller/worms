---
# apt sources (path-style apt-cacher-ng, non-free enabled) are configured by the
# apt_client role, which runs first in SetupPrivateInternet.yml.
- name: Install apache2, man2html and the man pages (POSIX ones are non-free)
  ansible.builtin.apt:
    name: [apache2, man2html, man-db, manpages, manpages-dev, manpages-posix, manpages-posix-dev, ca-certificates]
    state: present
    update_cache: "{{ internet_enabled | bool }}"  # offline re-runs: no index refresh
    cache_valid_time: "{{ 3600 if internet_enabled | bool else omit }}"

- name: Enable CGI module
  ansible.builtin.command: a2enmod cgi
  args:
    creates: /etc/apache2/mods-enabled/cgi.load
  notify: Restart apache2

- name: Set Apache listen port
  ansible.builtin.lineinfile:
    path: /etc/apache2/ports.conf
    regexp: '^Listen '
    line: "Listen {{ manpages_port }}"
  notify: Restart apache2

- name: Set VirtualHost port in default site
  ansible.builtin.replace:
    path: /etc/apache2/sites-available/000-default.conf
    regexp: '<VirtualHost \*:\d+>'
    replace: "<VirtualHost *:{{ manpages_port }}>"
  notify: Restart apache2

- name: Deploy search index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'

- name: Create the apache2 systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apache2.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the apache2 hardening drop-in
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/apache2.service.d/hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart apache2

- name: Enable and start apache2
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    state: started
    daemon_reload: true
