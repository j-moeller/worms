---
apt_cache_port: 3142
apt_cache_cache_dir: /var/cache/apt-cacher-ng
apt_cache_log_dir: /var/log/apt-cacher-ng
# Fetched into the cache whenever the internet is open (tasks/seed.yml). Untrusted
# VMs cannot install anything else, so a team's `apt install` of a package not
# listed here, and not fetched by another VM, fails. nftables: the gateways' rules.
# jq: not on a devbox by default, so `apt install jq` shows the path works and a
# reset removes it (tests/live).
# Every package a gameplan installs (gameplans/, their VM classes included) must be listed:
# the round agent refuses a gameplan that needs one that is not (tests/test_gameplan.py).
apt_cache_seed_packages:
  - ca-certificates
  - curl
  - jq
  - nftables
  - python3
  - python3-pip
  - rsync # devbox_packages: `worms rsync`
  - unzip
  # Common tools a team expects on a devbox (sandbox VMs reach the cache too: a worm
  # running as root on one can install these). With the above, some 350 packages and
  # 290 MB with their dependencies (2026-11, Debian 13).
  # Shell and editing:
  - bash-completion
  - file
  - htop
  - less
  - man-db
  - nano
  - screen
  - tmux
  - tree
  - vim
  # Building and debugging (python3-dev: C extensions an sdist builds):
  - build-essential
  - cmake
  - gdb
  - git
  - ltrace
  - pipx
  - pkg-config
  - python3-dev
  - strace
  # Network clients and diagnosis, and the programs devpi's python-nmap and pyshark
  # call (nmap, tshark):
  - bind9-dnsutils
  - inetutils-ftp
  - inetutils-telnet
  - iputils-ping
  - lftp
  - netcat-openbsd
  - nmap
  - postgresql-client
  - socat
  - sshpass
  - tcpdump
  - traceroute
  - tshark
  - wget
  # Archives, data and keys (oathtool: TOTP codes, as gameplans' logins ask for):
  - 7zip
  - bc
  - bzip2
  - fd-find
  - gnupg
  - lsof
  - oathtool
  - openssl
  - patch
  - psmisc
  - ripgrep
  - sqlite3
  - xxd
  - xz-utils
  - zip
  - zstd
  # Gameplans (src/gameplan/definition.py: DjangoVM, PostgreVM, add_telnet_login,
  # add_ssh_totp_login, add_ftp_login; gameplans/).
  - gunicorn
  - inetutils-inetd
  - inetutils-telnetd
  - libpam-google-authenticator
  - postgresql
  - python3-django
  - python3-venv
  - vsftpd
