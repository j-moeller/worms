---
# Host-side network security of the Proxmox host itself: sysctls, the nftables
# zone firewall (+ boot unit) and the Proxmox host firewall rule for the
# orchestrator. Runs on the host (over SSH from the controller), after the
# platform stack and `worms step inventory`. Proxmox-level resources (bridges, VM
# firewall, port-isolation hookscript) are managed by OpenTofu.
#
# Internet access for VMs is runtime state, toggled by Internet.yml.

- name: Configure the Proxmox host network
  hosts: proxmox_host
  # No facts: its roles use none (the host's packages come from package_facts), and the host's took
  # 19 s to gather, its many interfaces and disks.
  gather_facts: false
  become: true
  roles:
    - host_network
