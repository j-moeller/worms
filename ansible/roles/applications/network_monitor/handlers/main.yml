---
- name: Restart capture interface
  ansible.builtin.systemd:
    name: worms-capture-iface
    state: restarted
    daemon_reload: true

- name: Restart zeek
  ansible.builtin.systemd:
    name: zeek
    state: restarted
    daemon_reload: true

- name: Restart zeek-shipper
  ansible.builtin.systemd:
    name: zeek-shipper
    state: restarted
    daemon_reload: true
