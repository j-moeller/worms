---
# Central logging: an rsyslog server on the syslog VM (role syslog_server),
# auditd on every infrastructure VM, shipping its audit log there via rsyslog
# (role auditd). The server first, so the VMs' forwarders connect right away
# (they queue the events while it is unreachable).
- name: Set up the central log server
  hosts: syslog_hosts
  any_errors_fatal: true
  become: true
  roles:
    - syslog_server

- name: Set up auditd and log forwarding
  hosts: audit_hosts
  any_errors_fatal: true
  become: true
  roles:
    - auditd
