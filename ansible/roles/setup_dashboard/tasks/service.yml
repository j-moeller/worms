---

- name: Install systemd service
  ansible.builtin.template:
    src: django.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Django

- name: Enable Django service
  ansible.builtin.systemd:
    name: "{{ django_app_name }}"
    enabled: true
    state: started
    daemon_reload: true
