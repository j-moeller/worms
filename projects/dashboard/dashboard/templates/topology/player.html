
<header class="topo-bar">
    <div class="topo-title">// TOPOLOGY</div>
    <div class="topo-meta" id="topo-meta" aria-live="polite">Loading…</div>
    <div class="topo-actions">
        <label title="Gateways' own cards, wazuh, the devbox SSH gateway and unclassified VMs"><input type="checkbox" id="topo-aux"> auxiliary VMs</label>
        <button type="button" id="topo-fit" title="Fit the picture (F)">Fit</button>
        <button type="button" id="topo-reload" title="Reload the snapshot and the round list">Reload</button>
        <details class="topo-menu" id="topo-download-menu">
            <summary title="Save the round, or what is shown">Download</summary>
            <div class="topo-menu__panel">
                <a id="topo-dl-zip" href="#" download hidden>Round as .zip</a>
                <div id="topo-dl-options" hidden>
                    <label><input type="checkbox" id="topo-dl-logs" checked> with the log records</label>
                    <label><input type="checkbox" id="topo-dl-network" checked> with the network traffic</label>
                </div>
                <button type="button" id="topo-download" title="What is shown as one JSON file (log records stay references)">What is shown (.json)</button>
            </div>
        </details>
        <button type="button" id="topo-open" title="View a downloaded .zip or .json file (read locally; nothing is uploaded)">Open file…</button>
        <input type="file" id="topo-file" accept=".zip,.json,application/zip,application/json" hidden>
    </div>
</header>

<nav class="topo-tabs" id="topo-rounds" role="tablist" aria-label="Infrastructure or round"></nav>
<div class="topo-subbar"><nav class="topo-tabs sub" id="topo-teams" role="tablist" aria-label="Team"></nav></div>

<div class="topo-body">
    <div>
        <div class="topo-stage" id="topo-stage">
            <svg id="topo-svg" role="img" aria-label="Infrastructure: VMs and their operational connections"></svg>
            <canvas id="topo-dots"></canvas>
            <div class="topo-overlay">
                <div class="topo-banner" id="topo-banner" hidden></div>
            </div>
            <div class="topo-zoom">
                <button type="button" id="topo-zoom-in" aria-label="Zoom in">+</button>
                <button type="button" id="topo-zoom-out" aria-label="Zoom out">−</button>
            </div>
            <div class="topo-empty" id="topo-empty" hidden></div>
            <div class="topo-tip" id="topo-tip" hidden></div>
        </div>
        <div class="topo-legend" id="topo-legend"></div>

        <section class="topo-player" id="topo-player" hidden aria-label="Round player">
            <div class="topo-controls">
                <button type="button" class="topo-play" id="topo-play" aria-label="Play">▶</button>
                <button type="button" id="topo-prev" title="Previous event (,)">⏮</button>
                <button type="button" id="topo-back" title="Back 10 s (←)">−10s</button>
                <button type="button" id="topo-fwd" title="Forward 10 s (→)">+10s</button>
                <button type="button" id="topo-next" title="Next event (.)">⏭</button>
                <span class="time" id="topo-time">--:--</span>
                <span class="phase" id="topo-phase"></span>
                <span class="spacer"></span>
                <label class="phase" for="topo-speed">speed</label>
                <select id="topo-speed" aria-label="Playback speed"></select>
            </div>
            <div class="topo-track" id="topo-track" role="slider" tabindex="0" aria-label="Round time" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                <canvas id="topo-density"></canvas>
                <div class="rail"></div>
                <div class="fill" id="topo-fill"></div>
                <div id="topo-marks"></div>
                <div class="knob" id="topo-knob"></div>
                <div class="hover" id="topo-hover" hidden></div>
            </div>
            <div class="topo-axis" id="topo-axis"></div>
        </section>
    </div>

    <aside class="topo-side" id="topo-side" aria-label="Details" aria-live="polite"></aside>
</div>
