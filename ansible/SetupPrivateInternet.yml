---
# Private-internet services. VMs are spun up by opentofu/stacks/private_internet
# with base packages installed via cloud-init; this playbook configures them
# over the mgmt-exposed management network (management addresses).
#
# DNS is configured separately by SetupDNS.yml (setup_dns role).
# Run it after host/allow-internet.sh to populate the caches (online mode), and
# again after host/deny-internet.sh to switch them to offline mode: the mode
# follows the host state (internet_enabled in group_vars/all.yml). Internet
# access is refused while sandbox VMs exist.

# Point every private-internet VM's apt at the apt-cacher-ng cache (path-style),
# so package installs work both during prep and offline.
- hosts: private_internet
  become: true
  roles:
    - apt_client

- hosts: apt_cache_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init to finish (tolerate errors; roles ensure packages)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
  roles:
    - apt_cache

