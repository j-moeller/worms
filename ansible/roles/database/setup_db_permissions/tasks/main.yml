---
# Table privileges (defaults/main.yml: postgresql_table_privileges). Runs after
# the Django migrations, which create the tables; CONNECT and schema USAGE are
# granted by setup_db_base.

- name: List the tables in the public schema
  community.postgresql.postgresql_query:
    db: "{{ postgres_db }}"
    query: SELECT tablename FROM pg_tables WHERE schemaname = 'public'
  register: db_tables
  changed_when: false
  become_user: postgres

- name: Require the tables the privileges refer to
  ansible.builtin.assert:
    that: db_missing_tables | length == 0
    fail_msg: >-
      Tables missing: {{ db_missing_tables | join(', ') }}. The Django
      migrations have not run (or failed): they run on the orchestrator in
      SetupDbAndDashboard.yml (role django_app).
    quiet: true
  vars:
    db_missing_tables: >-
      {{ postgresql_table_privileges.values() | flatten
         | rejectattr('tables', 'equalto', 'ALL') | map(attribute='tables') | flatten | unique
         | difference(db_tables.query_result | map(attribute='tablename')) }}

# The roles' privileges before and after, to report "changed" only when the
# grants below actually change something.
- name: Read the current privileges
  community.postgresql.postgresql_query:
    db: "{{ postgres_db }}"
    query: "{{ db_privileges_query }}"
    named_args:
      roles: "{{ postgresql_table_privileges.keys() | list }}"
  register: db_privileges_before
  changed_when: false
  become_user: postgres

- name: Apply the table privileges (revoke all, grant exactly these)
  community.postgresql.postgresql_query:
    db: "{{ postgres_db }}"
    query: "{{ lookup('ansible.builtin.template', 'privileges.sql.j2') }}"
  changed_when: false
  become_user: postgres

- name: Read the new privileges
  community.postgresql.postgresql_query:
    db: "{{ postgres_db }}"
    query: "{{ db_privileges_query }}"
    named_args:
      roles: "{{ postgresql_table_privileges.keys() | list }}"
  register: db_privileges_after
  changed_when: db_privileges_after.query_result != db_privileges_before.query_result
  become_user: postgres
