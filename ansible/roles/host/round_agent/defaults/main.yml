---
# Round agent on the Proxmox host (docs/rounds.md). Pulls host_jobs from the
# database and executes the privileged round operations. Runs as root from its
# workspace on the node, synced from the controller's checkout
# (tasks/workspace.yml).
round_agent_repo_root: /opt/worms
round_agent_controller_repo: "{{ playbook_dir | dirname }}"
round_agent_node_run: /usr/local/sbin/worms-node-run
# What the workspace gets from the controller's checkout: no file git ignores,
# not the stacks the controller owns, nothing the agent does not run. The
# explicit excludes also keep rsync from deleting the node's own files (its
# state, providers, the definitions the agent writes): a .gitignore protects
# them only once it exists in the workspace, and never the vault or keys.
round_agent_sync_rsync_opts:
  - "--filter=:-_.gitignore"  # = ":- .gitignore" (synchronize splits on spaces)
  - "--exclude=/ansible/group_vars/vault.yml"
  - "--exclude=/ansible/.vault_pass"
  - "--exclude=/ansible/pki/"
  - "--exclude=/ansible/inventory.generated.yml"
  - "--exclude=/ansible/.facts/"
  - "--exclude=terraform.tfstate*"
  - "--exclude=.terraform/"
  - "--exclude=.terraform.lock.hcl"
  - "--exclude=/projects/"
  - "--exclude=/docs/"
  - "--exclude=/tests/"
  - "--exclude=/opentofu/stacks/platform/"
  - "--exclude=/opentofu/stacks/firewall/"
  - "--exclude=/opentofu/stacks/infrastructure/"
  - "--exclude=/opentofu/stacks/private_internet/"
  - "--exclude=/opentofu/stacks/sandbox/generated_vms*.tf"
  - "--exclude=/opentofu/stacks/devbox/generated_devboxes.tf"
round_agent_user: root
round_agent_env_file: /etc/worms/round-agent.env
round_agent_python: /usr/bin/python3

# Where the agent reads uploaded worm artifacts (the dashboard's media dir),
# over SSH from the host. Must match the dashboard's file storage.
round_agent_dashboard_host: "{{ management_ips.dashboard }}"
round_agent_dashboard_media_root: /opt/dashboard/media

# Scoring/logging management addresses: the agent writes the running team's
# uuid to them at deploy (the scoring/logging servers no longer use tokens).
round_agent_scoring_host: "{{ management_ips.scoring }}"
round_agent_logging_host: "{{ management_ips.logging }}"

# Database (round_agent role; job queue only). Connects to the core address.
round_agent_db_host: "{{ infrastructure_ips.database }}"
round_agent_db_port: 5432
round_agent_db_name: "{{ postgres_db }}"
round_agent_db_user: round_agent
round_agent_db_password: "{{ vault_round_agent_db_password }}"
round_agent_db_sslrootcert: "{{ round_agent_repo_root }}/ansible/pki/worms/ca.crt"

# OpenTofu from the agent (sandbox / devbox stacks): the inputs the CLI gives
# tofu on the controller, from the same vault (docs/accounts.md §4). The WORMS
# SSH key (vault) is loaded into an ssh-agent around the service
# (worms-node-run), because the bpg provider uploads snippets over SSH with
# `agent = true`; its .pub is what cloud-init puts on the sandbox and devbox
# VMs, as on every other VM.
round_agent_tofu_api_url: "https://127.0.0.1:{{ proxmox.api_port | default(8006) }}/"
round_agent_tofu_api_token: "{{ vault_tofu_proxmox_api_token | default('') }}"
round_agent_tofu_node: "{{ proxmox.node | default('worms-pve') }}"
round_agent_ssh_key: /etc/worms/ssh/worms

# Least-privilege Proxmox role for the orchestrator's power token: start/stop
# of sandbox VMs only. Granted on the sandbox pool.
round_agent_power_role: WormsSandboxPower
round_agent_power_privs: "VM.Audit,VM.PowerMgmt"
round_agent_power_token: "{{ proxmox_api_user }}!{{ proxmox_api_token_name }}"
round_agent_sandbox_pool: sandbox
