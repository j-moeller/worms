---
# Host-side network security of the Proxmox node (applied to localhost: the
# node is also the Ansible controller). Addresses come from the generated
# inventory (bridges, networks, host_ips, infrastructure_ips, proxmox).

# The host's internet-facing interface.
host_wan_interface: vmbr0

# DNAT <WAN>:443 -> dashboard:443 (expose the dashboard to the internet).
host_publish_dashboard: false

host_nft_file: /etc/worms/worms.nft

# Internet access for the VMs (tasks/internet.yml, playbook Internet.yml).
# The flag exists while access is allowed (tmpfs); the sandbox stack checks it.
host_internet_flag: /run/worms/internet-allowed
host_internet_group: /cluster/firewall/groups/provisioning
host_internet_rules:
  - {proto: tcp, dport: "80,443", comment: "internet allowed: HTTP(S)"}
  - {proto: udp, dport: "53", comment: "internet allowed: DNS"}
  - {proto: tcp, dport: "53", comment: "internet allowed: DNS"}

host_sysctls:
  net.ipv4.ip_forward: 1                 # routing between dmz/core/ingest
  net.ipv6.conf.all.forwarding: 0
  net.ipv4.conf.all.rp_filter: 1         # no spoofing across zones
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.all.arp_ignore: 1        # no ARP answers for addresses the host
  net.ipv4.conf.all.arp_announce: 2      # does not have on that bridge
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  # Connection tracking is shared by every VM (the Proxmox firewall tracks each
  # tap): room for floods, and idle entries expire in an hour, not 5 days.
  net.netfilter.nf_conntrack_max: 1048576
  net.netfilter.nf_conntrack_tcp_timeout_established: 3600
  net.netfilter.nf_conntrack_udp_timeout_stream: 60

# Per sandbox VM limits, enforced on the host bridges before sandbox-gw SNATs
# the traffic (bridge table in worms.nft). Over the limit = dropped.
host_sandbox_limits:
  services_syn_per_second: 20      # new TCP connections to the services bridge
  services_syn_burst: 40
  syn_per_second: 500              # new TCP connections anywhere
  syn_burst: 1000
  udp_pps: 5000                    # UDP packets
  udp_burst: 10000

# Watchdog: if the Proxmox firewall is not enforcing, hard-stop all sandbox VMs.
host_fw_watchdog_interval: 15s
host_fw_guest_table: "bridge proxmox-firewall-guests"
