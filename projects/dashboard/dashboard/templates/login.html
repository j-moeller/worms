{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth">
    <section class="panel auth__panel" aria-labelledby="login-title">
        <header class="panel__head">
            <h1 class="panel__title" id="login-title">Sign in</h1>
            <p class="panel__meta">Team accounts</p>
        </header>
        <form method="post" class="panel__body form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% if error %}
            <p class="alert alert--error" role="alert">{{ error }}</p>
            {% endif %}
            <div class="field">
                <label class="field__label" for="username">Username</label>
                <input class="input" type="text" id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
            </div>
            <div class="field">
                <label class="field__label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="form__actions">
                <button type="submit" class="btn btn--primary">Sign in</button>
            </div>
            <p class="form__note">First time here? Use the one-time password you were given; you will choose your own next.</p>
        </form>
    </section>
</div>
{% endblock %}
