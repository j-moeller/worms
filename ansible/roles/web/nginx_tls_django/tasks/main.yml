---
- name: Configure nginx for HTTPS only
  ansible.builtin.template:
    src: worms-tls.conf.j2
    dest: /etc/nginx/sites-available/worms-tls
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/worms-tls
    dest: /etc/nginx/sites-enabled/worms-tls
    state: link
  notify: Reload nginx

- name: Disable nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
