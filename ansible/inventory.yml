# Static, semantic inventory: GROUPS ONLY, no VM hosts.
#
# Which VMs exist is decided by OpenTofu: inventory.generated.yml (written by
# scripts/generate_inventory.py from the `ansible_hosts` output of every VM
# stack, `make inventory`) puts each VM into the group named after its OpenTofu
# key (db, dashboard, apt_cache, ...), with its management IP as ansible_host.
# A VM that is not in the OpenTofu state has no host, so no play contacts it
# (plays on an empty group are skipped).
#
# This file maps those VM groups to role groups; per-VM settings live in
# group_vars/<vm group>.yml; addressing comes from inventory.generated.yml
# (infrastructure_ips, management_ips, services_ips, private_internet_ips, ...).
# Both inventories are configured in ansible.cfg.
all:
  children:

    # The Proxmox node itself (also the Ansible controller). See
    # SetupHostNetwork.yml; set host_publish_dashboard: true here to expose the
    # dashboard on <WAN>:443.
    proxmox_host:
      hosts:
        proxmox.local:
          ansible_host: 127.0.0.1
          ansible_connection: local

    # ---- VM groups (filled by inventory.generated.yml) ----------------------
    database:
    dashboard:
    orchestrator:
    scoring:
    logging:
    dns:
    apt_cache:
    devpi:
    docker_registry:
    manpages:
    ntp:
    cve_search:
    wikipedia:
    sandbox_gw:
    sandbox:

    # ---- Role groups --------------------------------------------------------
    database_hosts:
      children:
        database:

    dns_hosts:
      children:
        dns:

    tls_hosts:
      children:
        scoring:
        logging:
        database:
        dashboard:
        orchestrator:

    nginx_hosts:
      children:
        scoring:
        logging:
        dashboard:
        orchestrator:

    # Sandbox-facing REST APIs (role sandbox_api).
    sandbox_api_hosts:
      children:
        scoring:
        logging:

    # Django application hosts (role django_app).
    django_hosts:
      children:
        dashboard:
        orchestrator:

    private_internet:
      children:
        apt_cache_hosts:
        devpi_hosts:
        docker_registry_hosts:
        manpages_hosts:
        ntp_hosts:
        cve_search_hosts:
        wikipedia_hosts:

    apt_cache_hosts:
      children:
        apt_cache:
    devpi_hosts:
      children:
        devpi:
    docker_registry_hosts:
      children:
        docker_registry:
    manpages_hosts:
      children:
        manpages:
    ntp_hosts:
      children:
        ntp:
    cve_search_hosts:
      children:
        cve_search:
    wikipedia_hosts:
      children:
        wikipedia:
