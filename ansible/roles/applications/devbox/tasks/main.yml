---
# Configure one devbox VM. The internal CA is installed separately
# (ca_distribute, SetupDevbox.yml). Idempotent and safe to re-run on a rebuild.

- name: Name the VM after itself
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# break-system-packages: without it Debian's pip refuses every plain `pip install`
# before contacting the index. The VM is the team's own and a reset rebuilds it, so
# there is no system to protect from them.
- name: Point pip at the private internet
  ansible.builtin.copy:
    dest: /etc/pip.conf
    content: |
      [global]
      index-url = {{ devbox_pip_index_url }}
      trusted-host = {{ devbox_pip_index_host }}
      break-system-packages = true
    owner: root
    mode: "0644"

# The offline apt cache serves only what it was filled with while the internet window was open
# (apt_cache_seed_packages). A package added to devbox_packages since (rsync, 2026-11-18, on a
# production cache filled before) is named and skipped, not a failure: a reset must work offline.
- name: Read the package index (from the private apt cache)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Find which expected packages the apt cache holds
  ansible.builtin.command:
    argv: [apt-cache, show, --no-all-versions, "{{ item }}"]
  loop: "{{ devbox_packages }}"
  register: devbox_package_check
  changed_when: false
  failed_when: false

- name: Install expected packages
  vars:
    devbox_packages_held: "{{ devbox_package_check.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
  when: devbox_packages_held | length > 0
  ansible.builtin.apt:
    name: "{{ devbox_packages_held }}"
    state: present
    install_recommends: false # 83 packages instead of 3, compilers and all

- name: Name the expected packages the apt cache lacks
  vars:
    devbox_packages_lacking: "{{ devbox_package_check.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
  when: devbox_packages_lacking | length > 0
  ansible.builtin.debug:
    msg: >-
      Not installed, the offline apt cache lacks them: {{ devbox_packages_lacking | join(', ') }}.
      They come with the cache's next fill (`worms build apt-cache --packages`, with the internet).

- name: Ensure the systemd-timesyncd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: Point the clock at the private-internet NTP server (offline time sync)
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/10-worms.conf
    content: |
      # Managed by Ansible (role devbox). The devbox has no internet, so sync
      # time from the private-internet NTP service, not the Debian pool.
      [Time]
      NTP={{ devbox_ntp_server }}
    owner: root
    mode: "0644"
  notify: Restart devbox timesyncd

# The team's SSH keys: tasks/keys.yml, which SetupDevbox.yml runs first, in a play of its own.

# systemd's getty on the serial console the VM does not have restarts every 10 s (role
# log_limits, tasks/serial_getty.yml).
- name: Stop the getty on the missing serial port
  ansible.builtin.include_role:
    name: log_limits
    tasks_from: serial_getty
