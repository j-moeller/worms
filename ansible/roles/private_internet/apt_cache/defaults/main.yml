---
apt_cache_port: 3142
apt_cache_cache_dir: /var/cache/apt-cacher-ng
apt_cache_log_dir: /var/log/apt-cacher-ng
# Fetched into the cache whenever the internet is open (tasks/seed.yml). Untrusted
# VMs cannot install anything else, so a team's `apt install` of a package not
# listed here, and not fetched by another VM, fails. nftables: the gateways' rules.
# jq: not on a devbox by default, so `apt install jq` shows the path works and a
# reset removes it (tests/live).
# Every package a gameplan installs (gameplans/, their VM classes included) must be listed:
# the round agent refuses a gameplan that needs one that is not (tests/test_gameplan.py).
apt_cache_seed_packages:
  - ca-certificates
  - curl
  - jq
  - nftables
  - python3
  - python3-pip
  - unzip
  # Gameplans (src/gameplan/definition.py: DjangoVM, PostgreVM, add_telnet_login,
  # add_ssh_totp_login; gameplans/).
  - gunicorn
  - inetutils-inetd
  - inetutils-telnetd
  - libpam-google-authenticator
  - postgresql
  - python3-django
  - python3-venv
