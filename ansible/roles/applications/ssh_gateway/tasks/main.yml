---
# Manage the trusted devbox SSH gateway's per-team key authorization. The
# hardened sshd itself comes from cloud-init (ssh-gateway.tftpl); here we only
# (re)write the team user's authorized_keys from the database-provided list, so
# adding/removing a team key or rebuilding takes effect on the next run.

# No shell: a jump opens no session, so it does not need one. With a shell, a team
# login could run commands here, on a VM that reaches every team's fabric address.
- name: Ensure the team user exists
  ansible.builtin.user:
    name: "{{ ssh_gateway_user }}"
    shell: /usr/sbin/nologin
    create_home: true
    state: present

# The team account is jump-only (its per-key options are the real confinement).
# Make its home, .ssh and authorized_keys root-owned so the team cannot rewrite
# its own authorized_keys -- and thus its permitopen/restrict confinement -- by
# deleting and recreating ~/.ssh (which it could do if it owned its home). sshd
# accepts a root-owned home for a non-root user under StrictModes. The account
# needs no writable home (no shell, no onward known_hosts). See
# docs/07-security.md (S3) and docs/04-dev-environment.md.
- name: Lock the team user's home to root (not writable by the team)
  ansible.builtin.file:
    path: "~{{ ssh_gateway_user }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the team user's .ssh directory (root-owned)
  ansible.builtin.file:
    path: "~{{ ssh_gateway_user }}/.ssh"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the confined authorized_keys (root-owned; one restricted line per team key)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "~{{ ssh_gateway_user }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0644"

- name: Assert the hardened sshd drop-in is present (from cloud-init)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/10-devbox-gateway.conf
  register: gateway_sshd
  failed_when: not gateway_sshd.stat.exists
