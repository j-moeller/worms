---
# Central logging: an rsyslog server on the syslog VM (role syslog_server),
# auditd on every infrastructure VM, shipping its audit log there via rsyslog
# (role auditd). The server first, so the VMs' forwarders connect right away
# (they queue the events while it is unreachable).
- name: Set up the central log server
  hosts: syslog_hosts
  any_errors_fatal: true
  become: true
  roles:
    - syslog_server

- name: Set up auditd and log forwarding
  hosts: audit_hosts
  any_errors_fatal: true
  become: true
  roles:
    - auditd

# The local logs (role log_limits): rsyslog's files rotate past a size, checked every hour, so
# that no noisy source fills a disk. After auditd, which installs rsyslog.
- name: Bound the local logs
  hosts: all:!proxmox_host:!untrusted
  any_errors_fatal: true
  become: true
  roles:
    - log_limits
