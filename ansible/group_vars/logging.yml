---
# Logging VM (OpenTofu: infrastructure/ephemeral, key logging).
tls_dns_name: logging.worms.internal
# Wildcard so a devbox can reach <team>.logging.worms.internal over verified
# HTTPS (docs/04-dev-environment.md); attribution is still by source address.
tls_extra_sans:
  - "DNS:*.logging.worms.internal"

# Sandbox-facing REST API: INSERT-only database role (+ SELECT on the access
# token hashes for validation).
sandbox_api_kind: logging
sandbox_api_db_user: dbuser_logging
sandbox_api_db_password: "{{ vault_dbuser_logging_password }}"
sandbox_api_max_body_bytes: 16384

# A team's rate (files/app.py, TeamLimiter). Higher than scoring's (30 a minute, a ban after 100
# refused within a minute, for 5 minutes: it keeps a team from guessing flags): teams log as they
# would print, and the old limits locked them out for 5 minutes (2026-11-23). 10,000 a minute, bursts
# of 1000 (2026-11-27; 600 and 120 before); only a flood is banned (20,000 refused within a minute),
# and only for a minute. The network limits under it are raised to match (2026-11-27), so that
# this one is what a team meets: nginx here, per source (every sandbox VM arrives as sandbox-gw,
# so it is the whole sandbox's; a devbox comes from its team's gateway), and the host's per-VM
# limit of new connections to the services (host_sandbox_limits).
sandbox_api_team_rate_per_minute: 10000
sandbox_api_team_burst: 1000
sandbox_api_team_ban_after: 20000
sandbox_api_team_ban_seconds: 60
# 10,000 a minute is 167 a second (scoring keeps the role's 50, bursts of 100, 200 connections).
sandbox_api_nginx_rate_per_second: 170
sandbox_api_nginx_burst: 1000
sandbox_api_nginx_max_connections: 1000
