---
# Dashboard VM (OpenTofu: infrastructure/persistent, key dashboard).
# The name on its certificate, and the only name it answers to (anything else
# gets "400 Bad Request"). A node not listed in the map fails the run.
tls_dns_name: "{{ dashboard_public_names[proxmox.node] }}"

django_variant: dashboard
django_settings_module: config.settings.dashboard
django_db_user: django_dashboard
django_db_password: "{{ vault_django_dashboard_password }}"
django_secret_key: "{{ vault_dashboard_secret_key }}"
django_allowed_hosts: "{{ tls_dns_name }}"
# The team API (/api/v1/, docs/team_api.md) is served here, rate-limited by nginx.
nginx_team_api: true
# Sign-in attempts per client address (staff pages are on this site too).
nginx_login_rate: 10r/m
# MAX_UPLOAD_SIZE (100 MiB) plus the multipart envelope.
nginx_upload_max_body_size: 101m
# Uploaded worms (MEDIA_ROOT): the one writable path of the service.
django_media_root: "{{ dashboard_media_root }}"
# Public facing: no migrator credentials, migrations run on the orchestrator.
django_run_migrations: false
# Infrastructure has no DNS resolver. Use the certificate's name in HTTPS,
# resolved locally to the orchestrator's management address.
django_host_aliases:
  - name: orchestrator.worms.internal
    address: "{{ infrastructure_ips.orchestrator }}"
django_extra_env:
  ORCHESTRATOR_URL: https://orchestrator.worms.internal
  ORCHESTRATOR_TLS_NAME: orchestrator.worms.internal
  ORCHESTRATOR_API_TOKEN: "{{ vault_orchestrator_dashboard_token }}"
  # The event tables' own account (core/events.py): INSERT into them, nothing else.
  EVENTS_DB_USER: dbuser_events_dashboard
  EVENTS_DB_PASSWORD: "{{ vault_dbuser_events_dashboard_password }}"
# The admin account (is_staff + superuser) and the default competition are
# created by the orchestrator's `manage.py init` after the migrations (the
# dashboard holds no migrator credentials). See group_vars/orchestrator.yml.
