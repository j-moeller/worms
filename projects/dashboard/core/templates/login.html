{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
            autofocus
        >
    </p>

    <p>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </p>

    <button type="submit">Log in</button>
</form>
{% endblock %}
