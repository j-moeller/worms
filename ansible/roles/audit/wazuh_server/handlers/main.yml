---
- name: Restart wazuh-indexer
  ansible.builtin.service:
    name: wazuh-indexer
    state: restarted

- name: Restart wazuh-manager
  ansible.builtin.service:
    name: wazuh-manager
    state: restarted

- name: Restart filebeat
  ansible.builtin.service:
    name: filebeat
    state: restarted
