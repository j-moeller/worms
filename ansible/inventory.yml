all:
  children:

    ca:
      hosts:
        pki_ca_host:
          ansible_host: 127.0.0.1

    dns_hosts:
      hosts:
        dns.worms.internal:
          ansible_host: 10.2.0.11
          ansible_user: debian
          dns_entries:
            - name: scoring.worms.internal
              ip: 10.3.0.14
            - name: logging.worms.internal
              ip: 10.3.0.15
            - name: database.worms.internal
              ip: 10.3.0.16
            - name: apt-cache.worms.internal
              ip: 10.2.0.20
            - name: pypi.worms.internal
              ip: 10.2.0.21
            - name: docker-registry.worms.internal
              ip: 10.2.0.22
            - name: manpages.worms.internal
              ip: 10.2.0.23
            - name: ntp.worms.internal
              ip: 10.2.0.24
            - name: cve-search.worms.internal
              ip: 10.2.0.25
            - name: wikipedia.worms.internal
              ip: 10.2.0.26
            - name: dashboard.worms.internal
              ip: 10.3.0.18
            - name: orchestrator.worms.internal
              ip: 10.3.0.19

    tls_hosts:
      hosts:
        scoring.worms.internal:
          ansible_host: 10.3.0.14
          ansible_user: debian
          tls_dns_name: scoring.worms.internal

        logging.worms.internal:
          ansible_host: 10.3.0.15
          ansible_user: debian
          tls_dns_name: logging.worms.internal

        database.worms.internal:
          ansible_host: 10.3.0.16
          ansible_user: debian
          tls_dns_name: database.worms.internal

        dashboard.worms.internal:
          ansible_host: 10.3.0.18
          ansible_user: debian
          tls_dns_name: dashboard.worms.internal

        orchestrator.worms.internal:
          ansible_host: 10.3.0.19
          ansible_user: debian
          tls_dns_name: orchestrator.worms.internal

    nginx_hosts:
      hosts:
        scoring.worms.internal:
        logging.worms.internal:
        dashboard.worms.internal:
        orchestrator.worms.internal:

    flask_hosts:
      hosts:
        scoring.worms.internal:
        logging.worms.internal:

    # Django application hosts. Per-host vars select the settings module, the
    # least-privilege DB user and (for the orchestrator) the Proxmox credentials.
    # All secret values are vault references, resolved from group_vars/vault.yml.
    django_hosts:
      hosts:
        dashboard.worms.internal:
          django_variant: dashboard
          django_settings_module: config.settings.dashboard
          django_db_user: django_dashboard
          django_db_password: "{{ vault_django_dashboard_password }}"
          django_secret_key: "{{ vault_dashboard_secret_key }}"
          django_allowed_hosts: "dashboard.worms.internal,10.3.0.18"

        orchestrator.worms.internal:
          django_variant: orchestrator
          django_settings_module: config.settings.orchestrator
          django_db_user: django_orchestrator
          django_db_password: "{{ vault_django_orchestrator_password }}"
          django_secret_key: "{{ vault_orchestrator_secret_key }}"
          django_allowed_hosts: "orchestrator.worms.internal,10.3.0.19"
          django_extra_pip_packages:
            - proxmoxer
            - requests
          # Proxmox credentials delivered securely into the env file (0600 root).
          django_extra_env:
            PROXMOX_HOST: "{{ proxmox_host }}"
            PROXMOX_PORT: "{{ proxmox_api_port }}"
            PROXMOX_NODE: "{{ proxmox_node }}"
            PROXMOX_USER: "{{ proxmox_api_user }}"
            PROXMOX_TOKEN_NAME: "{{ proxmox_api_token_name }}"
            PROXMOX_TOKEN_VALUE: "{{ proxmox_api_token_value }}"

    orchestrator:
      hosts:
        orchestrator.worms.internal:

    scoring:
      hosts:
        scoring.worms.internal:

    logging:
      hosts:
        logging.worms.internal:

    database:
      hosts:
        database.worms.internal:

    dashboard:
      hosts:
        dashboard.worms.internal:

    private_internet:
      children:
        apt_cache_hosts:
        devpi_hosts:
        docker_registry_hosts:
        manpages_hosts:
        ntp_hosts:
        cve_search_hosts:
        wikipedia_hosts:

    apt_cache_hosts:
      hosts:
        apt-cache.worms.internal:
          ansible_host: 10.3.0.2
          ansible_user: debian

    devpi_hosts:
      hosts:
        pypi.worms.internal:
          ansible_host: 10.3.0.3
          ansible_user: debian

    docker_registry_hosts:
      hosts:
        docker-registry.worms.internal:
          ansible_host: 10.3.0.4
          ansible_user: debian

    manpages_hosts:
      hosts:
        manpages.worms.internal:
          ansible_host: 10.3.0.5
          ansible_user: debian

    ntp_hosts:
      hosts:
        ntp.worms.internal:
          ansible_host: 10.3.0.6
          ansible_user: debian
          ntp_allow_network: 10.2.0.0/24

    cve_search_hosts:
      hosts:
        cve-search.worms.internal:
          ansible_host: 10.3.0.7
          ansible_user: debian

    wikipedia_hosts:
      hosts:
        wikipedia.worms.internal:
          ansible_host: 10.3.0.8
          ansible_user: debian
