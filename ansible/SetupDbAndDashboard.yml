---
# Database + Django application hosts (dashboard and orchestrator).
#
# Order matters:
#   1. Configure PostgreSQL and create the least-privilege roles.
#   2. Deploy the Django apps and run migrations (as django_migrator).
#   3. Grant the per-app table/sequence privileges (tables now exist).
#
# Secrets are provided by group_vars/vault.yml; run with --ask-vault-pass.

- name: Configure database server
  hosts: database
  become: true

  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

  roles:
    - setup_db_base


- name: Configure Django application servers (dashboard + orchestrator)
  hosts: django_hosts
  become: true

  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

  roles:
    - django_app


- name: Configure database permissions
  hosts: database
  become: true

  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

  roles:
    - setup_db_permissions
