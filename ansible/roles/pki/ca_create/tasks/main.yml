---
# The CA private key is always encrypted with pki_ca_passphrase, which comes
# from the vault (vault_pki_ca_passphrase, generated by `worms`: src/worms_cli/secrets.py).
# Every role that signs with the CA (nginx_tls, setup_db_base) uses the same
# variable.

- name: Require the CA passphrase from the vault
  ansible.builtin.assert:
    that:
      - pki_ca_passphrase is defined
      - pki_ca_passphrase | length >= 16
    fail_msg: >-
      vault_pki_ca_passphrase is missing or too short. Run `worms build secrets`
      (adds missing keys to the vault) and pass -e @group_vars/vault.yml.
    quiet: true
  no_log: "{{ hide_secrets }}"

- name: Create CA directory
  ansible.builtin.file:
    path: "{{ pki_ca_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check for an existing CA key
  ansible.builtin.stat:
    path: "{{ pki_ca_key_path }}"
  register: pki_ca_key_stat

- name: Check whether the existing CA key is encrypted
  ansible.builtin.command:
    argv: [grep, -qE, "{{ pki_ca_key_encrypted_pattern }}", "{{ pki_ca_key_path }}"]
  register: pki_ca_key_encrypted
  changed_when: false
  failed_when: pki_ca_key_encrypted.rc > 1
  when: pki_ca_key_stat.stat.exists

# A key created before the passphrase existed is encrypted in place, so the CA
# (and every certificate it issued) stays valid. No rotation.
- name: Encrypt the existing CA key with the vault passphrase
  community.crypto.openssl_privatekey_convert:
    src_path: "{{ pki_ca_key_path }}"
    dest_path: "{{ pki_ca_key_path }}"
    dest_passphrase: "{{ pki_ca_passphrase }}"
    format: pkcs8
    owner: root
    group: root
    mode: "0600"
  when: pki_ca_key_stat.stat.exists and pki_ca_key_encrypted.rc == 1
  no_log: "{{ hide_secrets }}"

# regenerate: never, so a wrong passphrase fails instead of silently replacing
# the CA (which would invalidate every issued certificate).
- name: Generate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_ca_key_path }}"
    type: RSA
    size: "{{ pki_ca_key_size }}"
    passphrase: "{{ pki_ca_passphrase }}"
    cipher: auto
    regenerate: never
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ hide_secrets }}"

- name: Verify the CA key is encrypted
  ansible.builtin.command:
    argv: [grep, -qE, "{{ pki_ca_key_encrypted_pattern }}", "{{ pki_ca_key_path }}"]
  changed_when: false

- name: Generate CA CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_ca_key_path }}"
    privatekey_passphrase: "{{ pki_ca_passphrase }}"
    common_name: "{{ pki_ca_common_name }}"
    organization_name: "{{ pki_ca_organization }}"
    use_common_name_for_san: false

    basic_constraints:
      - "CA:TRUE"
      - "pathlen:0"
    basic_constraints_critical: true

    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true

    create_subject_key_identifier: true
  register: pki_ca_csr
  changed_when: false  # in memory only
  no_log: "{{ hide_secrets }}"

- name: Generate self-signed root CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_ca_cert_path }}"
    csr_content: "{{ pki_ca_csr.csr }}"
    privatekey_path: "{{ pki_ca_key_path }}"
    privatekey_passphrase: "{{ pki_ca_passphrase }}"
    provider: selfsigned
    selfsigned_not_after: "{{ pki_ca_validity }}"
    owner: root
    group: root
    mode: "0644"
  no_log: "{{ hide_secrets }}"
