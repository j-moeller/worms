---
# Before resolv.conf points at the (not yet installed) local dnsmasq.
- name: Install dnsmasq
  ansible.builtin.apt:
    name: [dnsmasq, bind9-dnsutils, ca-certificates]
    state: present
    update_cache: "{{ internet_enabled | bool }}"
    cache_valid_time: 3600

- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  failed_when: false

- name: Remove resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Point resolv.conf to localhost
  ansible.builtin.copy:
    content: "nameserver 127.0.0.1\n"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure dnsmasq configuration directory exists
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy dnsmasq private network config
  ansible.builtin.template:
    src: private-internet.conf.j2
    dest: /etc/dnsmasq.d/private-internet.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started