django_app_name: dashboard
django_app_user: django
django_app_group: django

django_app_dir: /opt/dashboard
django_source_dir: /opt/dashboard/src
django_venv_dir: /opt/dashboard/venv

django_local_source: "{{ playbook_dir }}/../projects/dashboard"

django_asgi_module: "dashboard.asgi:application"
django_settings_module: "dashboard.settings"

db_user: django_dashboard
db_password: test # TODO # PASSWORD

gunicorn_workers: 2

required_packages:
  - python3
  - python3-venv
  - python3-pip
  - git
  - build-essential
  - rsync
  - acl

pip_packages:
  - django
  - gunicorn
  - psycopg2-binary
