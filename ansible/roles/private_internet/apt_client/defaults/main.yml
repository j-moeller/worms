---
# apt-cacher-ng endpoint (the apt_cache service VM) on the private network.
apt_client_cache_host: "{{ private_internet_ips.apt_cache.network }}"
apt_client_cache_port: 3142
# Where apt fetches from: through the cache, or straight from the Debian
# mirrors (only while internet access is allowed) when no apt_cache VM exists
# (it is commented out in opentofu/stacks/private_internet/main.tf).
apt_client_use_cache: "{{ groups['apt_cache'] | default([]) | length > 0 }}"
apt_client_mirror: "{{ ('http://' ~ apt_client_cache_host ~ ':' ~ apt_client_cache_port ~ '/') if apt_client_use_cache | bool else 'http://' }}deb.debian.org"
# Debian release layout.
apt_client_suites: "trixie trixie-updates trixie-backports"
apt_client_security_suite: "trixie-security"
apt_client_components: "main contrib non-free non-free-firmware"
