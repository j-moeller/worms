---
# Wait until freshly created VMs are reachable and cloud-init has finished
# (first boot: hostname, SSH key and hardening, data disk), so the following
# playbooks never race the first boot. Packages come from the roles.

- name: Wait for the infrastructure VMs
  hosts: all:!proxmox_host:!sandbox:!sandbox_gw
  any_errors_fatal: true
  gather_facts: false
  tasks:
    # First: a VM that was just created refuses SSH until it has booted.
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      # rc 2: finished with recoverable errors (degraded); reported, not fatal.
      failed_when: cloud_init.rc not in [0, 2]
