---
# The round agent's workspace on the host (docs/02-installation.md, "Controller on a laptop"): what the agent
# runs from -- the sandbox and devbox stacks (their state is the host's and
# stays here), the OpenTofu modules, the scripts, the CLI and the playbooks it
# runs -- plus the CA certificate and the platform/firewall state those two
# stacks read their inputs from. Never the vault, the CA key, or the code or
# state of the stacks the controller owns. `worms` runs these tasks
# (--tags agent-sync) before every step it runs on the host, so the host runs
# the controller's code.

# Everything the agent needs, checked before anything changes: `worms` adds the vault
# to every playbook it runs, a bare ansible-playbook does not.
- name: Check that the vault and the inventory have what the agent needs
  ansible.builtin.assert:
    that: round_agent_unset | length == 0
    fail_msg: >-
      Not set: {{ round_agent_unset | join(', ') }}. Run this through `worms` (`worms apply round-agent`, which adds
      the vault; by hand: ansible-playbook -e @group_vars/vault.yml SetupRoundAgent.yml), with the vault complete
      (`worms secret`) and the Proxmox token issued (`worms secret issue proxmox-token`).
    quiet: true
  vars:
    round_agent_required:
      vault_worms_ssh_key: "{{ vault_worms_ssh_key | default('') }}"
      vault_worms_ssh_public_key: "{{ vault_worms_ssh_public_key | default('') }}"
      vault_tofu_proxmox_api_token: "{{ vault_tofu_proxmox_api_token | default('') }}"
      vault_round_agent_db_password: "{{ vault_round_agent_db_password | default('') }}"
      vault_dbuser_events_node_password: "{{ vault_dbuser_events_node_password | default('') }}"
      proxmox.node: "{{ proxmox.node | default('') }}"
      worms_environments[proxmox.node]: "{{ 'listed' if (proxmox.node | default('')) in worms_environments else '' }}"
      proxmox.api_port: "{{ proxmox.api_port | default('') }}"
      ssh_gateway_ips.maintenance: "{{ ssh_gateway_ips.maintenance | default('') }}"
    round_agent_unset: "{{ round_agent_required | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}"

# Lists refreshed only when it is missing (ansible_facts.packages: main.yml), so a sync works offline.
- name: Install rsync (the workspace is synced with it)
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: "{{ 'rsync' not in ansible_facts.packages }}"
    cache_valid_time: "{{ 3600 if 'rsync' not in ansible_facts.packages else omit }}"

- name: Create the workspace
  ansible.builtin.file:
    path: "{{ round_agent_repo_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The agent used to run from a checkout on the host (REPO_ROOT in its env
# file). The first time, its sandbox and devbox state moves here, or OpenTofu
# would build those VMs a second time.
- name: Take over the sandbox and devbox state of the previous checkout
  ansible.builtin.shell: |
    set -eu
    new={{ round_agent_repo_root | quote }}
    old=$(sed -n 's/^REPO_ROOT=//p' {{ round_agent_env_file | quote }} 2>/dev/null || true)
    [ -n "$old" ] && [ "$old" != "$new" ] && [ -d "$old" ] || exit 0
    for stack in sandbox devbox; do
      from="$old/opentofu/stacks/$stack" to="$new/opentofu/stacks/$stack"
      [ -e "$from/terraform.tfstate" ] && [ ! -e "$to/terraform.tfstate" ] || continue
      mkdir -p "$to"
      cp -a "$from"/terraform.tfstate* "$to"/
      cp -a "$from"/generated_*.tf "$to"/ 2>/dev/null || true
      echo "took over $stack from $old"
    done
  register: round_agent_takeover
  changed_when: "'took over' in round_agent_takeover.stdout"

- name: Sync the code
  ansible.posix.synchronize:
    src: "{{ round_agent_controller_repo }}/"
    dest: "{{ round_agent_repo_root }}/"
    delete: true
    # rsync spawns its own ssh: use the connection's ssh args, not default keys
    # (same reason as django_app's sync). The host is reached directly today, so
    # this only adds ansible.cfg's ControlMaster opts; it stays correct if the
    # host is ever reached through a jump.
    use_ssh_args: true
    rsync_opts: "{{ round_agent_sync_rsync_opts }}"

# The workspace has no .git: the commit it was synced from goes with it, for the VM history the
# agent and the CLI it runs write (src/worms_cli/history.py). "-dirty": tracked files differ from it.
- name: Read the commit the workspace is synced from
  ansible.builtin.shell: |
    repo={{ round_agent_controller_repo | quote }}
    commit=$(git -C "$repo" rev-parse --short=7 HEAD 2>/dev/null) || { echo unknown; exit 0; }
    git -C "$repo" diff --quiet HEAD 2>/dev/null || commit="$commit-dirty"
    echo "$commit"
  delegate_to: localhost
  become: false
  register: round_agent_commit
  changed_when: false
  check_mode: false

- name: Record it in the workspace
  ansible.builtin.copy:
    content: "{{ round_agent_commit.stdout | trim }}\n"
    dest: "{{ round_agent_repo_root }}/.worms-commit"
    owner: root
    group: root
    mode: "0644"

# rsync leaves excluded files alone. A vault in the workspace (made there by mistake on
# 2026-11-06) made every job take the workspace for a controller and fail on it.
- name: Remove any vault from the workspace
  ansible.builtin.file:
    path: "{{ round_agent_repo_root }}/{{ item }}"
    state: absent
  loop: [ansible/group_vars/vault.yml, ansible/.vault_pass]

# The workspace holds no vault, by design, so it must not name the vault's key:
# with the key missing, every playbook here would fail before it starts.
- name: Drop the vault key from the workspace's ansible.cfg
  ansible.builtin.lineinfile:
    path: "{{ round_agent_repo_root }}/ansible/ansible.cfg"
    regexp: '^vault_password_file'
    state: absent

- name: Find the workspace's sandbox and devbox definitions
  ansible.builtin.find:
    paths: "{{ round_agent_repo_root }}/opentofu/stacks/{{ item }}"
    patterns: "generated_*.tf"
  loop: [sandbox, devbox]
  register: round_agent_definitions

# A new workspace starts with no sandbox and no devbox (the locals the stacks read, empty; the
# repository has none: until 2026-11-26 it seeded a sample with a fake team t1); the agent writes
# them from a gameplan, and from the teams (scripts/round_agent/handlers.py NO_SANDBOX).
- name: Start with no sandbox
  ansible.builtin.copy:
    dest: "{{ round_agent_repo_root }}/opentofu/stacks/sandbox/generated_vms.tf"
    mode: "0644"
    content: |
      # No sandbox: written by the workspace's first sync (the round agent writes it from a gameplan when it builds one).
      locals {
        gameplan        = ""
        gameplan_sha256 = ""

        sandbox_bridges = {}
        sandbox_vms     = {}
      }
  when: round_agent_definitions.results[0].matched == 0

- name: Start with no devbox
  ansible.builtin.copy:
    dest: "{{ round_agent_repo_root }}/opentofu/stacks/devbox/generated_devboxes.tf"
    mode: "0644"
    content: |
      # No devbox: written by the workspace's first sync (the round agent writes it from the teams).
      locals {
        devbox_bridges = {}
        devbox_gws     = {}
        devbox_vms     = {}
      }
  when: round_agent_definitions.results[1].matched == 0

- name: Create the directory for the controller's CA certificate
  ansible.builtin.file:
    path: "{{ round_agent_repo_root }}/ansible/pki/worms"
    state: directory
    mode: "0700"

- name: Copy the CA certificate
  ansible.builtin.copy:
    src: "{{ pki_ca_cert_path }}"
    dest: "{{ round_agent_repo_root }}/ansible/pki/worms/ca.crt"
    mode: "0600"

# The host's stacks read the platform's and the firewall's outputs from /var/lib/worms/outputs,
# published by the controller after every apply of them (`worms step outputs`): no copy of their
# state here any more, which only this sync refreshed (until 2026-11-26).
- name: Remove the copies of the platform and firewall state
  ansible.builtin.file:
    path: "{{ round_agent_repo_root }}/opentofu/stacks/{{ item }}"
    state: absent
  loop: [platform, firewall]

# Without internet too (scripts/tofu-init): a plain `tofu init` asks the registry even for a
# provider it has installed, and the host may have no outbound connection at all.
- name: Initialise the host's stacks (providers, from the host's mirror first)
  ansible.builtin.command:
    argv: [sh, "{{ round_agent_repo_root }}/scripts/tofu-init", "{{ round_agent_repo_root }}/opentofu/stacks/{{ item }}"]
  loop: [sandbox, devbox]
  changed_when: false

- name: Create the key directory
  ansible.builtin.file:
    path: "{{ round_agent_ssh_key | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The one key every VM authorizes (vault, worms_cli/secrets.py): the agent
# logs in to the VMs with it, OpenTofu uploads snippets to this host with it.
- name: Install the WORMS SSH key
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { content: "{{ vault_worms_ssh_key }}", dest: "{{ round_agent_ssh_key }}", mode: "0600" }
    - { content: "{{ vault_worms_ssh_public_key }}\n", dest: "{{ round_agent_ssh_key }}.pub", mode: "0644" }
  no_log: true

# Its .pub goes onto the sandbox and devbox VMs (TF_VAR_ssh_public_key), the private
# half logs in to them: they must be one key.
- name: Check that the WORMS key's halves belong together
  ansible.builtin.command: ssh-keygen -y -f {{ round_agent_ssh_key }}
  register: round_agent_key_public
  changed_when: false
  failed_when: >-
    round_agent_key_public.rc != 0
    or round_agent_key_public.stdout.split()[:2] != vault_worms_ssh_public_key.split()[:2]

# On Proxmox root's authorized_keys is a symlink into /etc/pve: keep it.
- name: Let the WORMS key log in as root on this host
  ansible.posix.authorized_key:
    user: root
    key: "{{ vault_worms_ssh_public_key }}"
    follow: true

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ round_agent_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the environment file (secrets)
  ansible.builtin.template:
    src: round-agent.env.j2
    dest: "{{ round_agent_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ hide_secrets }}"
  notify: Restart round agent

- name: Install worms-host-run (runs a command in the workspace as the agent)
  ansible.builtin.template:
    src: worms-host-run.j2
    dest: "{{ round_agent_host_run }}"
    owner: root
    group: root
    mode: "0755"

# Its name until 2026-11-22: the systemd unit above starts the agent through the new one.
- name: Remove worms-node-run, its old name
  ansible.builtin.file:
    path: /usr/local/sbin/worms-node-run
    state: absent
