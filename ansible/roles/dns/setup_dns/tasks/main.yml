---
# On a re-run this VM resolves through its own BIND (resolv.conf below), which
# is still in the mode of the last run: after an offline run it refuses every
# outside name, so apt could not reach the mirrors. Switch it to the current
# mode first.
- name: Check whether BIND is configured
  ansible.builtin.stat:
    path: /etc/bind/named.conf.options
  register: dns_bind_configured

- name: Switch BIND to the current internet mode before apt needs DNS
  when: dns_bind_configured.stat.exists
  block:
    - name: Deploy BIND options (before apt)
      ansible.builtin.template:
        src: named.conf.options.j2
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'
      register: dns_options_early

    - name: Restart named in the new mode
      ansible.builtin.systemd:
        name: named
        state: restarted
      when: dns_options_early.changed

# Before resolv.conf points at the (not yet installed) local resolver. Runs
# before UpdateVMs.yml, so an unattended upgrade may still hold the lock.
- name: Install BIND
  ansible.builtin.apt:
    name: [bind9, bind9-dnsutils, ca-certificates]
    state: present
    update_cache: "{{ internet_enabled | bool }}"
    cache_valid_time: 3600
    lock_timeout: 900

- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  failed_when: false

- name: Remove resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Point resolv.conf to localhost
  ansible.builtin.copy:
    content: "nameserver 127.0.0.1\n"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'

# BIND logs every query (see named.conf.options); its own channel bounds the
# file, so a query flood from a sandbox/devbox cannot fill the disk and take
# DNS down for everyone (docs/security-assessment.md, S8).
- name: Create the BIND query-log directory
  ansible.builtin.file:
    path: /var/log/named
    state: directory
    owner: bind
    group: bind
    mode: '0750'

- name: Deploy BIND options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: '0644'
  notify: Restart named

- name: Deploy the worms.internal zone declaration
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: '0644'
  notify: Restart named

- name: Deploy the worms.internal zone data
  ansible.builtin.template:
    src: db.worms.internal.j2
    dest: /etc/bind/db.worms.internal
    owner: root
    group: bind
    mode: '0644'
  notify: Restart named

- name: Enable and start named
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
