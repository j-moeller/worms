---
- name: Kernel network settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-worms.conf
    state: present
    reload: true
  loop: "{{ host_sysctls | dict2items }}"

# Sandbox and devbox VMs are assumed hostile and rooted. Their CPU type already hides hardware
# virtualisation from them. This is the second lock: with nesting off, no VM can get it from this
# node, whatever its config says (docs/security-assessment.md). It applies when the module next
# loads, so after a node restart, or with every VM stopped and kvm_intel reloaded.
- name: Turn off nested virtualisation
  ansible.builtin.copy:
    dest: /etc/modprobe.d/worms-no-nesting.conf
    content: |
      options kvm_intel nested=0
      options kvm_amd nested=0
    mode: "0644"
  tags: [kvm-nesting]

- name: Create configuration directory
  ansible.builtin.file:
    path: "{{ host_nft_file | dirname }}"
    state: directory
    mode: "0755"

# Port 22 on the WAN goes to the devbox SSH gateway: without sshd on another port the
# operators would lose SSH to the node with this ruleset.
- name: Check that operators keep SSH to the node
  when: host_publish_ssh_gateway | bool and (ssh_gateway_public_port | default(2222) | int) == 22
  block:
    - name: Read sshd's listening ports
      ansible.builtin.command: ss -Htln "sport = :{{ host_operator_ssh_port }}"
      register: host_operator_sshd
      changed_when: false

    - name: Refuse to forward port 22 while sshd is not on the operators' port
      ansible.builtin.assert:
        that: host_operator_sshd.stdout | length > 0
        fail_msg: >-
          Nothing listens on port {{ host_operator_ssh_port }} on this node, and this ruleset
          forwards port 22 from {{ host_wan_interface }} to the devbox SSH gateway: operators
          would lose SSH. Add "Port 22" and "Port {{ host_operator_ssh_port }}" to sshd and allow
          {{ host_operator_ssh_port }} in the Proxmox firewall first (docs/fresh-install.md, 2.5).

- name: Install nftables ruleset
  ansible.builtin.template:
    src: worms.nft.j2
    dest: "{{ host_nft_file }}"
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload host firewall

# Read by the former host/allow-internet.sh (now tasks/internet.yml).
- name: Remove legacy host network environment
  ansible.builtin.file:
    path: /etc/worms/host.env
    state: absent

- name: Install host firewall unit
  ansible.builtin.template:
    src: worms-host-firewall.service.j2
    dest: /etc/systemd/system/worms-host-firewall.service
    mode: "0644"
  notify: Reload host firewall

- name: Enable host firewall
  ansible.builtin.systemd:
    name: worms-host-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: Apply ruleset changes now
  ansible.builtin.meta: flush_handlers

# Reloading the ruleset empties the runtime internet gate; keep it consistent
# with the flag if internet access is currently allowed.
- name: Check whether internet access is allowed
  ansible.builtin.stat:
    path: "{{ host_internet_flag }}"
  register: internet_flag

- name: Restore internet gate
  ansible.builtin.command: nft add element inet worms internet_wan '{ "{{ host_wan_interface }}" }'
  when: internet_flag.stat.exists
  changed_when: true

# Fail-safe: hard-stop all sandbox VMs whenever the Proxmox firewall is not
# enforcing (see the script header). Logs to syslog (auth.crit).
- name: Install firewall watchdog
  ansible.builtin.template:
    src: worms-firewall-watchdog.sh.j2
    dest: /usr/local/sbin/worms-firewall-watchdog
    mode: "0755"

- name: Install firewall watchdog units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - worms-firewall-watchdog.service
    - worms-firewall-watchdog.timer

- name: Enable firewall watchdog
  ansible.builtin.systemd:
    name: worms-firewall-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true

# Traffic mirror for the monitor VM (see the script header).
- name: Install traffic mirror
  ansible.builtin.template:
    src: worms-mirror.sh.j2
    dest: /usr/local/sbin/worms-mirror
    mode: "0755"
  notify: Restart traffic mirror

- name: Install traffic mirror unit
  ansible.builtin.template:
    src: worms-mirror.service.j2
    dest: /etc/systemd/system/worms-mirror.service
    mode: "0644"
  notify: Restart traffic mirror

- name: Enable traffic mirror
  ansible.builtin.systemd:
    name: worms-mirror
    enabled: "{{ host_mirror_enabled }}"
    state: "{{ 'started' if host_mirror_enabled else 'stopped' }}"
    daemon_reload: true

- name: Remove the mirror filters (mirror disabled)
  ansible.builtin.command: /usr/local/sbin/worms-mirror clear
  when: not host_mirror_enabled
  changed_when: false

# The Proxmox host firewall (input policy DROP) must also let the orchestrator
# reach the API. Kept here rather than in OpenTofu: managing node-level rules
# there risks taking over the datacenter rule list.
- name: Read Proxmox host firewall rules
  ansible.builtin.command: pvesh get /nodes/{{ proxmox.node }}/firewall/rules --output-format json
  register: node_rules
  changed_when: false

- name: Allow orchestrator -> Proxmox API in the Proxmox host firewall
  ansible.builtin.command: >-
    pvesh create /nodes/{{ proxmox.node }}/firewall/rules
    --type in --action ACCEPT --proto tcp --dport {{ proxmox.api_port }}
    --source {{ infrastructure_ips.orchestrator }} --dest {{ host_ips.core }}
    --enable 1 --comment "worms: orchestrator -> Proxmox API"
  when: >-
    node_rules.stdout | from_json | selectattr('comment', 'defined')
    | selectattr('comment', 'equalto', 'worms: orchestrator -> Proxmox API') | list | length == 0

# Earlier versions sealed egress with an iptables-legacy service.
- name: Remove legacy egress service
  ansible.builtin.systemd:
    name: worms-private-internet-egress
    state: stopped
    enabled: false
  failed_when: false

- name: Remove legacy egress files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/worms-private-internet-egress.service
    - /usr/local/sbin/worms-private-internet-egress
