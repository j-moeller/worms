---
- name: Configure apt-cacher-ng port
  ansible.builtin.lineinfile:
    path: /etc/apt-cacher-ng/acng.conf
    regexp: '^Port:'
    line: "Port: {{ apt_cache_port }}"
  notify: Restart apt-cacher-ng

- name: Point apt-cacher-ng upstream at the egress proxy
  ansible.builtin.lineinfile:
    path: /etc/apt-cacher-ng/acng.conf
    regexp: '^Proxy:'
    line: "Proxy: {{ apt_cache_upstream_proxy }}"
  notify: Restart apt-cacher-ng

- name: Enable and start apt-cacher-ng
  ansible.builtin.systemd:
    name: apt-cacher-ng
    enabled: true
    state: started
