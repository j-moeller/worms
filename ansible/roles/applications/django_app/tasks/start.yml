---
# The migrations (on the orchestrator), the commands after them, and the services (Site.yml,
# phase 4: once the database has its users).
# Whether the database lacks a migration of this code: the database itself says (a dump restored
# from before one, new code), not this role's stamp. Exit 1: some are pending. Until 2026-11-21 the
# services were stopped and `migrate` run on every configure of the orchestrator.
- name: Does the database lack migrations?
  when: django_run_migrations | bool
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py migrate --check --noinput --database=migrator"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  no_log: "{{ hide_secrets }}"
  register: django_migrations_pending
  changed_when: false
  failed_when: django_migrations_pending.rc not in [0, 1]
  environment: "{{ django_migrate_env | combine(django_extra_env) }}"
  vars:
    django_migrate_env: &django_migrate_env
      # libpq applies this per connection: a migration whose DDL lock is still
      # held (by a service we could not stop, e.g. the dashboard) fails fast
      # with a clear error instead of hanging the whole run forever.
      PGOPTIONS: "-c lock_timeout={{ django_migrate_lock_timeout }}"
      PRODUCTION: "1"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ django_secret_key }}"
      DJANGO_ALLOWED_HOSTS: "{{ django_allowed_hosts }}"
      DB_NAME: "{{ django_db_name }}"
      DB_HOST: "{{ django_db_host }}"
      DB_PORT: "{{ django_db_port | string }}"
      DB_SSLMODE: "{{ django_db_sslmode }}"
      DB_SSLROOTCERT: "{{ django_db_sslrootcert }}"
      DB_USER: "{{ django_db_user }}"
      DB_PASSWORD: "{{ django_db_password }}"
      DB_MIGRATOR_USER: "{{ postgres_migrator_name }}"
      DB_MIGRATOR_PASSWORD: "{{ postgres_migrator_password }}"

# Stop this host's long-running Django services before migrating. They hold
# open database transactions (the orchestrator's conduct_rounds /
# process_attempts loop continuously), and a migration's DDL needs an ACCESS
# EXCLUSIVE lock -- left running, the migration queues behind them and
# `migrate` hangs indefinitely. The "Enable Django service" / "Enable
# management daemons" tasks below start them again. Only the migrating host
# (orchestrator) is affected; the public dashboard is a different host and
# keeps serving. Safe to re-run: conduct_rounds resumes from the database.
- name: Stop Django services before migrating (avoid DDL lock contention)
  when: django_run_migrations | bool and django_migrations_pending.rc | default(1) == 1
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: "{{ [django_app_name] + (django_daemons | map(attribute='name') | map('regex_replace', '^', django_app_name ~ '-') | list) }}"
  loop_control:
    label: "{{ item }}"
  # Not installed yet on the first deploy: nothing to stop.
  failed_when: false

# Only the orchestrator migrates; the public-facing dashboard has no migrator
# credentials at all (they are not in its env file either).
- name: Run Django migrations
  when: django_run_migrations | bool and django_migrations_pending.rc | default(1) == 1
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py migrate --noinput --database=migrator"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  no_log: "{{ hide_secrets }}"
  # Same variables as the env file (django.env.j2): the settings module
  # requires all of them in production, e.g. PROXMOX_* on the orchestrator.
  environment: "{{ django_migrate_env | combine(django_extra_env) }}"
  vars:
    django_migrate_env: *django_migrate_env

# Idempotent post-migration commands run once provisioning (e.g. the
# orchestrator's `init`: the admin account and the default competition). Same
# environment as the migrations (writes go through the migrator connection),
# so they run only where django_run_migrations is set.
- name: Run post-migration management commands
  when: django_run_migrations | bool
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py {{ item }}"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  no_log: "{{ hide_secrets }}"
  loop: "{{ django_post_migrate_commands }}"
  # Idempotent (`init` makes what is missing and says so in its output): not a change of the VM.
  changed_when: false
  environment: "{{ django_migrate_env | combine(django_extra_env) }}"
  vars:
    django_migrate_env:
      PGOPTIONS: "-c lock_timeout={{ django_migrate_lock_timeout }}"
      PRODUCTION: "1"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ django_secret_key }}"
      DJANGO_ALLOWED_HOSTS: "{{ django_allowed_hosts }}"
      DB_NAME: "{{ django_db_name }}"
      DB_HOST: "{{ django_db_host }}"
      DB_PORT: "{{ django_db_port | string }}"
      DB_SSLMODE: "{{ django_db_sslmode }}"
      DB_SSLROOTCERT: "{{ django_db_sslrootcert }}"
      DB_USER: "{{ django_db_user }}"
      DB_PASSWORD: "{{ django_db_password }}"
      DB_MIGRATOR_USER: "{{ postgres_migrator_name }}"
      DB_MIGRATOR_PASSWORD: "{{ postgres_migrator_password }}"

- name: Install systemd service
  ansible.builtin.template:
    src: django.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Django

- name: Enable Django service
  ansible.builtin.systemd:
    name: "{{ django_app_name }}"
    enabled: true
    state: started
    daemon_reload: true

# Periodic management commands (e.g. the orchestrator's collect_topology).
# The first runs may fail until SetupDbAndDashboard.yml has granted the table
# privileges (setup_db_permissions); the timer simply retries.
- name: Install management command services
  ansible.builtin.template:
    src: django-command.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd

- name: Install management command timers
  ansible.builtin.template:
    src: django-command.timer.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd

- name: Enable management command timers
  ansible.builtin.systemd:
    name: "{{ django_app_name }}-{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"

# Long-running management commands (e.g. the orchestrator's conduct_rounds).
- name: Install management daemon services
  ansible.builtin.template:
    src: django-daemon.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_daemons }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd
    - Restart Django

- name: Enable management daemons
  ansible.builtin.systemd:
    name: "{{ django_app_name }}-{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ django_daemons }}"
  loop_control:
    label: "{{ item.name }}"

# What setup.yml changed (code, settings, the gameplans, the Proxmox CA), now that the migrations
# are through: the restart its handler noted (Site.yml runs setup.yml in an earlier play).
- name: Restart Django, its code or settings changed
  ansible.builtin.debug:
    msg: "restarting {{ django_app_name }} and its daemons"
  changed_when: true
  notify: Restart Django
  when: django_restart_due | default(false) | bool
  tags: [gameplans]
