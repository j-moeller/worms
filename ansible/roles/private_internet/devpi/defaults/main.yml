---
devpi_port: 3141
devpi_host: 0.0.0.0
devpi_server_dir: /var/lib/devpi
devpi_venv: /opt/devpi
devpi_user: devpi
devpi_root_password: "{{ vault_devpi_root_password }}"
# Fetched through the mirror whenever the internet is open (tasks/seed.yml); pip
# pulls each one's dependencies too. With the internet closed devpi serves only
# what it already holds, so anything not seeded here fails to install offline.
# The list is the common Python toolchain a team is likely to want on a worm or
# devbox: build/test tools, web, data, and the usual security/CTF libraries.
devpi_seed_packages:
  - pip
  - setuptools
  - wheel
  - build
  - packaging
  - virtualenv
  - pip-tools
  - poetry
  - uv
  - ipython
  - ipykernel
