---
# Connection diagnostics for one VM or group, step by step, so a failure shows
# WHERE it breaks (each step runs even if an earlier one failed):
#
#   make debug HOST=database                  (or HOST=dns_hosts, HOST=database.worms.internal)
#   cd ansible && ansible-playbook Debug.yml -e target=database -vvv   (full SSH trace)
#
#   1. what Ansible resolved (address, user, VMID, OpenTofu stack): no connection
#   2. TCP port 22 from the controller        -> network / Proxmox firewall
#   3. SSH login without Python (raw)         -> keys, user, host key
#   4. Python module (ping)                   -> interpreter
#   5. sudo (become)                          -> privilege escalation
#   6. cloud-init state                       -> first boot finished? packages?

- name: Diagnose the connection to {{ target }}
  hosts: "{{ target }}"
  gather_facts: false
  ignore_unreachable: true
  ignore_errors: true

  tasks:
    - name: 1. Resolved connection
      ansible.builtin.debug:
        msg:
          - "ssh {{ ansible_user | default('(current user)') }}@{{ ansible_host | default(inventory_hostname) }}"
          - "Proxmox VMID {{ proxmox_vm_id | default('-') }}  (qm status {{ proxmox_vm_id | default('<vmid>') }})"
          - "OpenTofu stack {{ opentofu_stack | default('- (static host)') }}"
          - "groups: {{ group_names | join(', ') }}"

    - name: 2. TCP port 22 reachable from the controller
      ansible.builtin.wait_for:
        # hostvars: under delegate_to, ansible_host would be localhost's.
        host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: 5
      delegate_to: localhost

    - name: 3. SSH login (no Python needed)
      ansible.builtin.raw: id && hostname
      changed_when: false

    - name: 4. Python modules
      ansible.builtin.ping:

    - name: 5. sudo
      ansible.builtin.command: id -un
      become: true
      changed_when: false

    - name: 6. cloud-init state
      ansible.builtin.command: cloud-init status --long
      changed_when: false
      failed_when: false
      register: debug_cloud_init

    - name: 6. cloud-init state (result)
      ansible.builtin.debug:
        msg: "{{ debug_cloud_init.stdout_lines | default(['(no output)']) }}"
