# Static, semantic inventory: GROUPS ONLY, no VM hosts.
#
# Which VMs exist is decided by OpenTofu: inventory.generated.yml (written by
# scripts/generate_inventory.py from the `ansible_hosts` output of every VM
# stack, `make inventory`) puts each VM into the group named after its OpenTofu
# key (db, dashboard, apt_cache, ...), with its management IP as ansible_host.
# A VM that is not in the OpenTofu state has no host, so no play contacts it
# (plays on an empty group are skipped).
#
# This file maps those VM groups to role groups; per-VM settings live in
# group_vars/<vm group>.yml; addressing comes from inventory.generated.yml
# (infrastructure_ips, management_ips, services_ips, private_internet_ips, ...).
# Both inventories are configured in ansible.cfg.
all:
  children:

    # The Proxmox node itself. How Ansible reaches it (local on the node, SSH
    # from a laptop) is in inventory.generated.yml. See SetupHostNetwork.yml.
    # host_publish_dashboard: <WAN>:443 reaches the dashboard's :443.
    # host_publish_ssh_gateway: <WAN>:2222 reaches the devbox SSH gateway's :22.
    proxmox_host:
      hosts:
        proxmox.local:
          host_publish_dashboard: true
          host_publish_ssh_gateway: true

    # ---- VM groups (filled by inventory.generated.yml) ----------------------
    database:
    dashboard:
    orchestrator:
    scoring:
    logging:
    dns:
    apt_cache:
    devpi:
    docker_registry:
    manpages:
    ntp:
    cve_search:
    wikipedia:
    syslog:
    monitor:
    sandbox_gw:
    sandbox:
    # Devbox (docs/devbox.md): the untrusted per-team VMs, their per-team
    # gateways, and the trusted shared SSH gateway.
    devbox:
    devbox_gw:
    ssh_gateway:

    # ---- Role groups --------------------------------------------------------
    untrusted:
      children:
        sandbox:
        sandbox_gw:
        devbox:
        devbox_gw:

    database_hosts:
      children:
        database:

    dns_hosts:
      children:
        dns:

    tls_hosts:
      children:
        scoring:
        logging:
        monitor:
        database:
        dashboard:
        orchestrator:

    nginx_hosts:
      children:
        scoring:
        logging:
        dashboard:
        orchestrator:

    # Sandbox-facing REST APIs (role sandbox_api).
    sandbox_api_hosts:
      children:
        scoring:
        logging:

    # Devbox VM configuration (role devbox: CA trust + team keys).
    devbox_hosts:
      children:
        devbox:

    # Trusted devbox SSH gateway (role ssh_gateway: confined authorized_keys).
    ssh_gateway_hosts:
      children:
        ssh_gateway:

    # Network monitor: Zeek on the mirror bridge, flow records -> database
    # (role network_monitor).
    network_monitor_hosts:
      children:
        monitor:

    # Central log server (role syslog_server).
    syslog_hosts:
      children:
        syslog:

    # auditd + log forwarding to the syslog VM (role auditd): every infrastructure VM.
    audit_hosts:
      children:
        database:
        dashboard:
        orchestrator:
        scoring:
        logging:
        monitor:
        dns:
        private_internet:
        syslog:

    # Django application hosts (role django_app).
    django_hosts:
      children:
        dashboard:
        orchestrator:

    private_internet:
      children:
        apt_cache_hosts:
        devpi_hosts:
        docker_registry_hosts:
        manpages_hosts:
        ntp_hosts:
        cve_search_hosts:
        wikipedia_hosts:

    apt_cache_hosts:
      children:
        apt_cache:
    devpi_hosts:
      children:
        devpi:
    docker_registry_hosts:
      children:
        docker_registry:
    manpages_hosts:
      children:
        manpages:
    ntp_hosts:
      children:
        ntp:
    cve_search_hosts:
      children:
        cve_search:
    wikipedia_hosts:
      children:
        wikipedia:
