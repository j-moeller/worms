[defaults]
# Both inventories: the static semantic one and the one generated from OpenTofu
# (make inventory). Every IP in inventory.yml resolves from inventory.generated.yml.
inventory = inventory.yml,inventory.generated.yml

# Auto-generated key for the encrypted vault (scripts/generate_secrets.py), so
# playbooks never prompt for a vault password. Git-ignored.
vault_password_file = .vault_pass

# Lab VMs are rebuilt frequently and get fresh host keys each time; skip the
# interactive host-key prompt so `make` runs unattended. (Trade-off: no SSH
# host-key pinning on the maintenance network.)
host_key_checking = False

interpreter_python = auto_silent

[ssh_connection]
pipelining = true
