---
# Where a VM's apt fetches from. Straight from the Debian mirrors (while the internet window is
# open), for every VM that runs this role but the sandbox and devbox VMs and their gateways:
# group_vars/untrusted.yml sends those, and only those, through the apt cache (the apt_cache
# service VM, apt-cacher-ng), the one place they can get packages from.
apt_client_use_cache: false
apt_client_cache_host: apt-cache.worms.internal
apt_client_cache_port: 3142
# Refresh the index after changing the sources even with the internet closed: for VMs that have no
# index yet and can fill it from the cache (group_vars/untrusted.yml).
apt_client_refresh_offline: false
apt_client_mirror: "{{ ('http://' ~ apt_client_cache_host ~ ':' ~ apt_client_cache_port ~ '/') if apt_client_use_cache | bool else 'http://' }}deb.debian.org"
# Debian release layout.
apt_client_suites: "trixie trixie-updates trixie-backports"
apt_client_security_suite: "trixie-security"
apt_client_components: "main contrib non-free non-free-firmware"
