# -----------------------------------------------------------------------------
# Non-secret platform variables.
#
# SECRETS LIVE IN group_vars/vault.yml (ansible-vault encrypted) and are
# referenced here as {{ vault_* }}. There are NO plaintext passwords in this
# file or anywhere in version control. The `worms` CLI keeps the encrypted
# vault (src/worms_cli/secrets.py; docs/accounts.md section 4).
# -----------------------------------------------------------------------------

# The one external address sandbox and devbox VMs may send to, on TCP 443: the LLM
# endpoint, teachllm.mlsec.tu-berlin.de (security group llm-access,
# docs/security-assessment.md). `worms` passes it to OpenTofu as TF_VAR_llm_access_ip.
llm_access_ip: 141.23.117.34
# Its name, the one outside name the private DNS answers (roles/dns/setup_dns).
llm_access_name: teachllm.mlsec.tu-berlin.de

# Addressing is the OpenTofu ground truth. `infrastructure_ips`,
# `private_internet_ips`, `networks` and `proxmox` are provided by
# inventory.generated.yml (written by scripts/generate_inventory.py from
# `tofu output`). Nothing here hardcodes an IP; run playbooks with
#   -i inventory.yml -i inventory.generated.yml
# so these references resolve.

# Tasks that handle secrets hide their output (no_log). For debugging, show it:
#   make provision ARGS="--limit orchestrator -e hide_secrets=false"
# (the output then contains passwords: do not paste it anywhere).
hide_secrets: true

# --- Which system this is -----------------------------------------------------
# The switch: the Proxmox node's name (its hostname, `hostname -s`; proxmox.node in
# the inventory) says whether this is production or development, and this is
# everything that differs between the two. A node not listed here is refused, by
# `worms` (src/worms_cli/session.py) and by every play that needs one of these.
# Django's DEBUG is not part of it: off on both (PRODUCTION=1 means "deployed").
#   public_name              teams reach the dashboard (HTTPS) and the devbox SSH
#                            gateway under it
#   operator_ssh_port        the node's own sshd (management; OpenTofu uploads
#                            snippets over it)
#   ssh_gateway_public_port  the devbox SSH gateway's port on the WAN (DNAT to its :22)
worms_environments:
  worms:
    name: production
    public_name: worms.mlsec.tu-berlin.de
    operator_ssh_port: 2222
    ssh_gateway_public_port: 22
  worms-dev:
    name: development
    public_name: worms-dev.mlsec.tu-berlin.de
    operator_ssh_port: 22
    ssh_gateway_public_port: 2222
worms_environment: "{{ worms_environments[proxmox.node] }}"
ssh_gateway_public_port: "{{ worms_environment.ssh_gateway_public_port }}"

# --- PostgreSQL -------------------------------------------------------------
postgres_db: mydb
postgres_host: "{{ infrastructure_ips.database }}"

# The admin (SUPERUSER) role may log in remotely only from the Proxmox host
# (/32, from the OpenTofu ground truth), never from other VMs on the maintenance
# network. Ansible itself never needs it: it administers PostgreSQL as `postgres`
# over the local socket. Set to [] to disable remote superuser logins entirely.
# Migrator: the orchestrator only. Application users: their own VM (/32).
postgres_admin_name: admin
postgres_admin_password: "{{ vault_postgres_admin_password }}"
postgres_admin_cidrs:
  - "{{ proxmox.host }}/32"

postgres_migrator_name: django_migrator
postgres_migrator_password: "{{ vault_postgres_migrator_password }}"
# Migrations run only on the orchestrator. The public-facing dashboard never
# holds the migrator credentials (the migrator owns the tables).
postgres_migrator_cidrs:
  - "{{ infrastructure_ips.orchestrator }}/32"

# Least-privilege application DB users. Each may connect only from its own VM.
postgresql_users:
  - name: django_dashboard
    password: "{{ vault_django_dashboard_password }}"
    cidr: "{{ infrastructure_ips.dashboard }}/32"
  - name: django_orchestrator
    password: "{{ vault_django_orchestrator_password }}"
    cidr: "{{ infrastructure_ips.orchestrator }}/32"
  - name: dbuser_logging
    password: "{{ vault_dbuser_logging_password }}"
    cidr: "{{ infrastructure_ips.logging }}/32"
    conn_limit: 8   # sandbox-facing: bounded (app pool: 4)
  - name: dbuser_network_monitor
    password: "{{ vault_dbuser_network_monitor_password }}"
    cidr: "{{ infrastructure_ips.monitor }}/32"
    conn_limit: 4   # parses sandbox traffic: bounded (zeek-shipper: 1)
  - name: dbuser_scoring
    password: "{{ vault_dbuser_scoring_password }}"
    cidr: "{{ infrastructure_ips.scoring }}/32"
    conn_limit: 8   # sandbox-facing: bounded (app pool: 4)
  # Round agent on the Proxmox host (docs/rounds.md): job queue only.
  - name: round_agent
    password: "{{ vault_round_agent_db_password }}"
    cidr: "{{ proxmox.host }}/32"
    conn_limit: 4
  # The event tables (core/models/events.py, docs/monitoring.md): one account per
  # writing component, used for nothing else, INSERT only. The console writes as
  # the admin.
  - name: dbuser_events_dashboard
    password: "{{ vault_dbuser_events_dashboard_password }}"
    cidr: "{{ infrastructure_ips.dashboard }}/32"
    conn_limit: 8   # one per gunicorn worker at most
  - name: dbuser_events_node
    password: "{{ vault_dbuser_events_node_password }}"
    cidr: "{{ proxmox.host }}/32"
    conn_limit: 2

# --- PKI / internal CA ------------------------------------------------------
pki_domain: worms.internal

pki_ca_host: localhost
pki_ca_passphrase: "{{ vault_pki_ca_passphrase }}"

pki_ca_common_name: "worms.mlsec.de"
pki_ca_organization: "Machine Learning and Security - WORMS project"

pki_ca_key_path: "{{ playbook_dir }}/pki/worms/ca.key"
pki_ca_cert_path: "{{ playbook_dir }}/pki/worms/ca.crt"

pki_ca_key_size: 4096
pki_ca_validity: "+3650d"

pki_server_key_size: 3072
pki_server_validity: "+825d"

# --- Worm uploads -------------------------------------------------------------
# Where the dashboard stores uploaded worms (Django MEDIA_ROOT; role django_app)
# and where the round agent reads them over SSH (role round_agent). One value
# for both. Outside the application's source tree, which is rsynced with
# --delete and read-only to the service.
dashboard_media_root: /opt/dashboard/media

# --- Proxmox (consumed by the orchestrator via proxmoxer) -------------------
# Host / port / node come from the OpenTofu ground truth as `proxmox`
# (inventory.generated.yml). Only the identity + API token live here; the
# token value is a vault secret, passed securely to the orchestrator at init.
proxmox_api_user: "orchestrator@pam"
proxmox_api_token_name: "orchestrator-prov"
proxmox_api_token_value: "{{ vault_proxmox_api_token_value }}"

# Separate READ-ONLY identity used by the orchestrator to collect the topology
# (VMs, bridges, firewall) for the dashboard's TOPOLOGY page. It needs the
# PVEAuditor role on `/` (for the user AND, with privilege separation, the
# token). The token secret lives in the vault; until it is set the collector
# simply reports "not configured".
proxmox_readonly_api_user: "topology@pve"
proxmox_readonly_api_token_name: "readonly"
proxmox_readonly_api_token_value: "{{ vault_proxmox_readonly_api_token_value | default('') }}"

# Whether internet access is currently allowed (Internet.yml writes this flag
# on the Proxmox node). Not a switch: it follows the host. The `exists` test
# runs on the controller, so it is right on the node; from a laptop `worms`
# probes the node and passes `-e internet_enabled=...` to every playbook.
#   true  = caches proxy/forward upstream (population), DNS forwards upstream
#   false = standalone offline caches, no internet anywhere
internet_enabled: "{{ '/run/worms/internet-allowed' is exists }}"
