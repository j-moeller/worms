---
# auditd records what happens on the VM (/var/log/audit/audit.log); rsyslog
# ships that file to the central log server (the syslog VM).
- name: Install auditd and rsyslog
  ansible.builtin.apt:
    name:
      - auditd
      - rsyslog
    state: present
    update_cache: "{{ internet_enabled | bool }}"
    cache_valid_time: "{{ 3600 if internet_enabled | bool else omit }}"

- name: Install audit rules
  ansible.builtin.template:
    src: worms.rules.j2
    dest: /etc/audit/rules.d/worms.rules
    mode: "0640"
  notify: Load audit rules

# Debian's auditd.conf suspends logging when the disk runs low, full or failing, and never resumes
# by itself: dns logged nothing from 2026-11-14 (its disk filled with DNS query logs, S8) to
# 2026-11-22, while `auditctl -s` said enabled, lost 0. A warning in syslog instead, and auditd
# goes on writing as soon as there is room again.
- name: Keep auditd logging when the disk runs low
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ auditd_disk_actions | dict2items }}"
  notify:
    - Reload the auditd configuration
    - Resume auditd logging

- name: Forward the audit log to the log server
  ansible.builtin.template:
    src: 60-audit-forward.conf.j2
    dest: /etc/rsyslog.d/60-audit-forward.conf
    mode: "0644"
  notify: Restart rsyslog

- name: Enable auditd and rsyslog
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - rsyslog
