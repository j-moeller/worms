---
# Private-internet services. VMs are spun up by opentofu/stacks/private_internet
# (cloud-init: first boot only); this playbook installs and configures them
# over the mgmt-exposed management network (management addresses).
#
# DNS is configured separately by SetupDNS.yml (setup_dns role).
# The mode follows the host state (internet_enabled in group_vars/all.yml):
# `make` runs it while internet is allowed to populate the caches (online
# mode), and again after denying it to switch them to offline mode.

# The cache first: it installs apt-cacher-ng from the Debian mirrors before
# apt_client points its own apt (like every other service's) at itself.
- hosts: apt_cache_hosts
  any_errors_fatal: true
  become: true
  pre_tasks:
    - name: Wait for cloud-init to finish (tolerate errors; roles ensure packages)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
  roles:
    - apt_cache

# Then point every private-internet VM's apt at the apt-cacher-ng cache (path-style),
# so package installs work both during prep and offline.
- hosts: private_internet
  any_errors_fatal: true
  become: true
  roles:
    - apt_client

