---
- name: Deploy squid whitelist config
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart squid

- name: Enable and start squid
  ansible.builtin.systemd:
    name: squid
    enabled: true
    state: started
