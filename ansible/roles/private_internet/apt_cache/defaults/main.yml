---
apt_cache_port: 3142
apt_cache_cache_dir: /var/cache/apt-cacher-ng
apt_cache_log_dir: /var/log/apt-cacher-ng
# Fetched into the cache whenever the internet is open (tasks/seed.yml). Untrusted
# VMs cannot install anything else, so a team's `apt install` of a package not
# listed here, and not fetched by another VM, fails. nftables: the gateways' rules.
# jq: not on a devbox by default, so `apt install jq` shows the path works and a
# reset removes it (tests/live). What else belongs here: docs/status.md, decisions.
apt_cache_seed_packages:
  - ca-certificates
  - curl
  - jq
  - nftables
  - python3
  - python3-pip
  - unzip
