---

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Create Django group
  ansible.builtin.group:
    name: "{{ django_app_group }}"
    system: true
    state: present

- name: Create Django user
  ansible.builtin.user:
    name: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    system: true
    # create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ django_app_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    mode: "0755"

- name: Create source directory
  ansible.builtin.file:
    path: "{{ django_source_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    mode: "0755"

- name: Synchronize Django application
  ansible.posix.synchronize:
    src: "{{ django_local_source }}/"
    dest: "{{ django_source_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
  notify:
    - Restart Django

- name: Set Django application ownership
  ansible.builtin.file:
    path: "{{ django_source_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    recurse: true

- name: Create virtual environment
  command:
    cmd: python3 -m venv "{{ django_venv_dir }}"
    creates: "{{ django_venv_dir }}/bin/python"

- name: Upgrade pip
  pip:
    name: pip
    state: latest
    virtualenv: "{{ django_venv_dir }}"

- name: Install Python packages
  pip:
    virtualenv: "{{ django_venv_dir }}"
    name: "{{ pip_packages }}"

- name: Create Django environment file
  template:
    src: django.env.j2
    dest: /etc/django.env
    owner: root
    group: root
    mode: "0600"

- name: Run Django migrations
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py migrate --noinput --database=migrator"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  environment:
    PRODUCTION: "1"

#- name: Collect Django static files
#  ansible.builtin.command:
#    cmd: "{{ django_venv_dir }}/bin/python manage.py collectstatic --noinput"
#    chdir: "{{ django_source_dir }}"
#  become_user: "{{ django_app_user }}"
#  environment:
#    PRODUCTION: "1"

- name: Install systemd service
  ansible.builtin.template:
    src: django.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd

- name: Enable Django service
  ansible.builtin.systemd:
    name: "{{ django_app_name }}"
    enabled: true
    state: started
    daemon_reload: true
  notify:
    - Restart Django
