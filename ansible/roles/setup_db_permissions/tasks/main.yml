---

#
# Database permissions
#

- name: Grant database CONNECT
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item.name }}"
    type: database
    privs: CONNECT
    state: present
  loop: "{{ postgresql_users }}"
  become_user: postgres


- name: Grant schema usage
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item.name }}"
    objs: public
    type: schema
    privs: USAGE
    state: present
  loop: "{{ postgresql_users }}"
  become_user: postgres


# django_dashboard:
# - query all tables
# - insert uploads (uploads, malware_artifacts)
- name: Grant SELECT on all tables to django_dashboard
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_dashboard
    objs: ALL_IN_SCHEMA
    schema: public
    type: table
    privs: SELECT
    state: present
  become_user: postgres


- name: Grant SELECT on all sequences to django_dashboard
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_dashboard
    objs: ALL_IN_SCHEMA
    schema: public
    type: sequence
    privs: SELECT
    state: present
  become_user: postgres


# Uploads: the artifact row and the upload record.
- name: Grant INSERT on upload tables to django_dashboard
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_dashboard
    objs: "{{ item }}"
    type: table
    privs: INSERT
    state: present
  loop:
    - uploads
    - malware_artifacts
  become_user: postgres


- name: Grant USAGE on upload sequences to django_dashboard
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_dashboard
    objs: "{{ item }}"
    type: sequence
    privs: USAGE
    state: present
  loop:
    - uploads_id_seq
    - malware_artifacts_id_seq
  become_user: postgres


# dbuser_logging
# - insert into logging table
- name: Grant INSERT on logging_attempts table
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: dbuser_logging
    objs: logging_attempts
    type: table
    privs: INSERT
    state: present
  become_user: postgres


- name: Grant USAGE on logging_id_seq
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: dbuser_logging
    objs: logging_id_seq
    type: sequence
    privs: USAGE
    state: present
  become_user: postgres


# dbuser_scoring
# - insert into scoring table
- name: Grant INSERT on flag_capture_attempts table
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: dbuser_scoring
    objs: flag_capture_attempts
    type: table
    privs: INSERT
    state: present
  become_user: postgres


- name: Grant USAGE on flag_capture_attempts_id_seq
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: dbuser_scoring
    objs: flag_capture_attempts_id_seq
    type: sequence
    privs: USAGE
    state: present
  become_user: postgres


# django_orchestrator
# - reads competition/round/team/upload/vm state
# - writes virtual_machines, worm_deployment_plans, worm_deployments
# - writes topology_snapshots (Proxmox topology, read by the dashboard)
- name: Grant SELECT on all tables to django_orchestrator
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_orchestrator
    objs: ALL_IN_SCHEMA
    schema: public
    type: table
    privs: SELECT
    state: present
  become_user: postgres


- name: Grant INSERT/UPDATE on orchestrator-owned tables
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_orchestrator
    objs: "{{ item }}"
    type: table
    privs: SELECT,INSERT,UPDATE
    state: present
  loop:
    - virtual_machines
    - worm_deployment_plans
    - worm_deployments
    - topology_snapshots
  become_user: postgres


- name: Grant USAGE on orchestrator sequences
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: django_orchestrator
    objs: "{{ item }}"
    type: sequence
    privs: USAGE
    state: present
  loop:
    - virtual_machines_id_seq
    - worm_deployment_plans_id_seq
    - worm_deployments_id_seq
    - topology_snapshots_id_seq
  become_user: postgres
