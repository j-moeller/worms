[defaults]
# Both inventories: the static semantic one and the one generated from OpenTofu
# (make inventory). Every IP in inventory.yml resolves from inventory.generated.yml.
inventory = inventory.yml,inventory.generated.yml

# Auto-generated key for the encrypted vault (scripts/generate_secrets.py), so
# playbooks never prompt for a vault password. Git-ignored.
vault_password_file = .vault_pass

# Lab VMs are rebuilt frequently and get fresh host keys each time; skip the
# interactive host-key prompt so `make` runs unattended. (Trade-off: no SSH
# host-key pinning on the maintenance network.)
host_key_checking = False

interpreter_python = auto_silent

# More feedback during long runs: per-task durations, the slowest tasks at the
# end, and total elapsed time. (profile_tasks prints each task's run time as it
# finishes, so a step that takes minutes is visible afterwards; for a single
# long task, watch its own log -- see the Wazuh install.)
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

# Roles are grouped by component (roles/README.md). Every group folder is on
# the role path, so playbooks keep referring to roles by name only. Relative
# paths here resolve against this file's directory.
roles_path = roles/host:roles/pki:roles/web:roles/database:roles/applications:roles/dns:roles/private_internet:roles/audit

[ssh_connection]
pipelining = true
