---
# Database + Django application hosts (dashboard and orchestrator).
#
# Order matters:
#   1. Configure PostgreSQL and create the least-privilege roles.
#   2. Deploy the Django apps and run migrations (as django_migrator).
#   3. Grant the per-app table/sequence privileges (tables now exist).
#
# Secrets are provided by group_vars/vault.yml. First boot (cloud-init) is
# awaited by WaitForVMs.yml, which `make configure` runs first.

- name: Configure database server
  hosts: database
  become: true

  roles:
    - setup_db_base


- name: Configure Django application servers (dashboard + orchestrator)
  hosts: django_hosts
  become: true

  roles:
    - django_app


- name: Configure database permissions
  hosts: database
  become: true

  roles:
    - setup_db_permissions
