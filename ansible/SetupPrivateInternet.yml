---
# Private-internet services. VMs are spun up by opentofu/stacks/private_internet
# with base packages installed via cloud-init; this playbook configures them
# over the maintenance network (10.3.x.x).
#
# DNS is configured separately by SetupDNS.yml (Jonas' setup_dns role).

- hosts: egress_proxy_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  roles:
    - egress_proxy

- hosts: apt_cache_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0
  roles:
    - apt_cache

- hosts: devpi_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  roles:
    - devpi

- hosts: docker_registry_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  roles:
    - docker_registry

- hosts: manpages_hosts
  become: true
  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  roles:
    - manpages

- hosts: ntp_hosts
  become: true
  pre_tasks:
