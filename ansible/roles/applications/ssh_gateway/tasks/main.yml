---
# Manage the trusted devbox SSH gateway's per-team key authorization. The
# hardened sshd itself comes from cloud-init (ssh-gateway.tftpl); here we only
# (re)write the team user's authorized_keys from the database-provided list, so
# adding/removing a team key or rebuilding takes effect on the next run.

- name: Ensure the team user exists
  ansible.builtin.user:
    name: "{{ ssh_gateway_user }}"
    shell: /bin/sh
    create_home: true
    state: present

- name: Ensure the team user's .ssh directory
  ansible.builtin.file:
    path: "~{{ ssh_gateway_user }}/.ssh"
    state: directory
    owner: "{{ ssh_gateway_user }}"
    mode: "0700"

- name: Write the confined authorized_keys (one restricted line per team key)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "~{{ ssh_gateway_user }}/.ssh/authorized_keys"
    owner: "{{ ssh_gateway_user }}"
    mode: "0600"

- name: Assert the hardened sshd drop-in is present (from cloud-init)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/10-devbox-gateway.conf
  register: gateway_sshd
  failed_when: not gateway_sshd.stat.exists
