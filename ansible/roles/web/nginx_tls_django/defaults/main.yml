tls_key_path: /etc/nginx/tls/server.key
tls_cert_path: /etc/nginx/tls/server.crt
tls_ca_path: /etc/nginx/tls/ca.crt

# The team API (/api/, dashboard only: group_vars/dashboard.yml). A team
# paging through a round's logs needs a few requests per second; anything
# beyond the burst gets 429 before it reaches Django.
nginx_team_api: false
nginx_team_api_rate_per_ip: 5r/s
nginx_team_api_burst_per_ip: 20
nginx_team_api_rate_per_token: 3r/s
nginx_team_api_burst_per_token: 10
nginx_team_api_connections_per_ip: 8
nginx_team_api_timeout: 15s

# Sign-in attempts per client address (POST /login/; dashboard only:
# group_vars/dashboard.yml). Empty: not limited. The burst lets a person
# mistype a few times; a guesser is slowed to the rate.
nginx_login_rate: ""
nginx_login_burst: 5

# collectstatic output of this host's Django app (role django_app,
# django_static_root -- keep the two equal).
nginx_django_static_root: "/opt/{{ django_variant | default('dashboard') }}/static"
# Body limit of the worm upload (/upload/; dashboard only, group_vars). Empty:
# no upload location, nginx's default 1 MiB applies everywhere.
nginx_upload_max_body_size: ""
