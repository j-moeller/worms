- name: Configures TLS on nginx servers for django
  hosts: django_hosts
  any_errors_fatal: true
  become: true

  pre_tasks:
    - name: Wait for cloud-init completion
      ansible.builtin.command:
        cmd: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc != 0

  roles:
    - role: nginx_tls_django
