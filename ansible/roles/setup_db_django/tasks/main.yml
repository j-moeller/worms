- name: Make Django migrations
  ansible.builtin.command:
    cmd: "../venv/bin/python manage.py makemigrations"
    chdir: "/root/app/projects/dashboard"

- name: Apply Django migrations using migrator database
  ansible.builtin.command:
    cmd: "../venv/bin/python manage.py migrate --database=migrator"
    chdir: "/root/app/projects/dashboard"