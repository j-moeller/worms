{% extends "base.html" %}

{% block header %}
<title>WORM//ARENA — Login</title>
{% endblock %}


{% block content %}

<style>
    .login-page {
        width: min(520px, 92%);
        min-height: calc(100vh - 68px);

        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 0px 0;
    }


    .login-panel {
        width: 100%;

        position: relative;

        background:
            linear-gradient(
                145deg,
                rgba(13, 17, 24, 0.97),
                rgba(6, 8, 12, 0.97)
            );

        border: 1px solid rgba(0, 229, 255, 0.16);

        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.4),
            0 0 40px rgba(0, 229, 255, 0.025);
    }


    .login-panel::before {
        content: "";

        position: absolute;
        top: -1px;
        left: 24px;

        width: 55px;
        height: 1px;

        background: #00e5ff;

        box-shadow:
            0 0 12px rgba(0, 229, 255, 0.8);
    }


    .login-header {
        padding: 30px 32px 25px;

        border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    }


    .login-classification {
        color: #ff3158;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 2px;
        text-transform: uppercase;
    }


    .login-title {
        margin: 0;

        color: #d8e2e8;

        font-family: "Share Tech Mono", monospace;
        font-size: 2.2rem;
        font-weight: normal;
        letter-spacing: 2px;
        text-transform: uppercase;
    }


    .login-title span {
        color: #00e5ff;

        text-shadow:
            0 0 20px rgba(0, 229, 255, 0.25);
    }


    .login-subtitle {
        margin: 12px 0 0;

        color: #68757f;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.72rem;
        line-height: 1.6;
    }


    .login-form {
        padding: 30px 32px 32px;
    }


    .login-error {
        display: flex;
        align-items: flex-start;
        gap: 10px;

        margin-bottom: 25px;
        padding: 12px 14px;

        background: rgba(255, 49, 88, 0.045);

        border: 1px solid rgba(255, 49, 88, 0.2);

        color: #ff6b86;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.72rem;
        line-height: 1.5;
    }


    .login-error::before {
        content: "[!]";

        color: #ff3158;
        flex-shrink: 0;
    }


    .form-field {
        margin-bottom: 22px;
    }


    .form-field label {
        display: block;

        margin-bottom: 8px;

        color: #68757f;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }


    .form-field label::before {
        content: "// ";

        color: #00e5ff;
        opacity: 0.65;
    }


    .form-field input {
        width: 100%;

        display: block;

        padding: 14px 15px;

        background: #05070a;

        border: 1px solid rgba(255, 255, 255, 0.09);

        outline: none;

        color: #d8e2e8;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.9rem;

        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease,
            background 0.15s ease;
    }


    .form-field input:hover {
        border-color: rgba(0, 229, 255, 0.2);
    }


    .form-field input:focus {
        background: #06090d;

        border-color: rgba(0, 229, 255, 0.55);

        box-shadow:
            0 0 0 1px rgba(0, 229, 255, 0.08),
            0 0 20px rgba(0, 229, 255, 0.06);
    }


    .form-field input::placeholder {
        color: #343e45;
    }


    .login-submit {
        width: 100%;

        margin-top: 5px;
        padding: 15px 20px;

        border: 1px solid #00e5ff;

        background: rgba(0, 229, 255, 0.025);

        color: #00e5ff;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.78rem;
        letter-spacing: 2px;
        text-transform: uppercase;

        cursor: pointer;

        transition:
            background 0.15s ease,
            color 0.15s ease,
            box-shadow 0.15s ease;
    }


    .login-submit:hover {
        background: #00e5ff;

        color: #050609;

        box-shadow:
            0 0 25px rgba(0, 229, 255, 0.2);
    }


    .login-submit:active {
        transform: translateY(1px);
    }


    .login-footer {
        display: flex;
        justify-content: space-between;

        margin-top: 24px;
        padding-top: 18px;

        border-top: 1px solid rgba(255, 255, 255, 0.045);

        color: #39434a;

        font-family: "Share Tech Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.8px;
        text-transform: uppercase;
    }


    .login-footer .secure {
        color: #39ff88;
    }


    @media (max-width: 560px) {

        .login-page {
            width: 94%;
            min-height: calc(100vh - 60px);

            padding: 35px 0;
        }


        .login-header,
        .login-form {
            padding-left: 22px;
            padding-right: 22px;
        }


        .login-title {
            font-size: 1.8rem;
        }


        .login-footer {
            flex-direction: column;
            gap: 8px;
        }

    }
</style>


<div class="login-page">

    <section class="login-panel">

        <form method="post" class="login-form">

            {% csrf_token %}


            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}


            <div class="form-field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="ENTER USERNAME"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="ENTER PASSWORD"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-submit"
            >
                Authenticate →
            </button>


        </form>

    </section>

</div>

{% endblock %}
