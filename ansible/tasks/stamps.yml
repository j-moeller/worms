---
# Every role's stamp on this VM, at once (Site.yml, a VM's first phase): what each role last ran
# from, to its end (action_plugins/worms_role_gate.py compares, tasks/role.yml writes them).
- name: The roles' stamps here
  ansible.builtin.shell: >-
    mkdir -p -m 0700 /var/lib/worms/stamps &&
    for f in /var/lib/worms/stamps/*; do [ -f "$f" ] && printf '%s %s\n' "${f##*/}" "$(cat "$f")"; done; true
  register: worms_stamps
  changed_when: false
