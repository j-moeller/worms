---
- name: Configure nginx for HTTPS only
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/worms-tls
    owner: root
    group: root
    mode: "0644"
    content: |
      server {
          listen 80;
          listen [::]:80;

          server_name {{ tls_dns_name }};

          return 301 https://$host$request_uri;
      }

      server {
          listen 443 ssl;
          listen [::]:443 ssl;

          server_name {{ tls_dns_name }};

          ssl_certificate {{ tls_cert_path }};
          ssl_certificate_key {{ tls_key_path }};

          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

          location / {
              proxy_pass http://unix:/run/flask/flask.sock;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/worms-tls
    dest: /etc/nginx/sites-enabled/worms-tls
    state: link
  notify: Reload nginx

- name: Disable nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
