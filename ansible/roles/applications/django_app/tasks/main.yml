---
- name: Assert required per-host variables are set
  ansible.builtin.assert:
    that:
      - django_variant is defined
      - django_settings_module is defined
      - django_db_user is defined
      - django_db_password is defined
      - django_secret_key is defined
      - django_allowed_hosts is defined
    fail_msg: >-
      django_app requires django_variant, django_settings_module, django_db_user,
      django_db_password, django_secret_key and django_allowed_hosts (set them in
      inventory host_vars and the vault).

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Create Django group
  ansible.builtin.group:
    name: "{{ django_app_group }}"
    system: true
    state: present

- name: Create Django user
  ansible.builtin.user:
    name: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    mode: "0750"
  loop:
    - "{{ django_app_dir }}"
    - "{{ django_source_dir }}"

- name: Synchronize Django application
  ansible.posix.synchronize:
    src: "{{ django_local_source }}/"
    dest: "{{ django_source_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
      - "--exclude=db.sqlite3"
  notify:
    - Restart Django

- name: Set Django application ownership
  ansible.builtin.file:
    path: "{{ django_source_dir }}"
    state: directory
    owner: "{{ django_app_user }}"
    group: "{{ django_app_group }}"
    recurse: true

- name: Create virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ django_venv_dir }}"
    creates: "{{ django_venv_dir }}/bin/python"

- name: Upgrade pip
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ django_venv_dir }}"

- name: Install Python packages
  ansible.builtin.pip:
    virtualenv: "{{ django_venv_dir }}"
    name: "{{ pip_packages + django_extra_pip_packages }}"

- name: Create secret directory
  ansible.builtin.file:
    path: "{{ django_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install Django environment file (secrets)
  ansible.builtin.template:
    src: django.env.j2
    dest: "{{ django_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ hide_secrets }}"
  notify:
    - Restart Django

# Only the orchestrator migrates; the public-facing dashboard has no migrator
# credentials at all (they are not in its env file either).
- name: Run Django migrations
  when: django_run_migrations | bool
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py migrate --noinput --database=migrator"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  no_log: "{{ hide_secrets }}"
  # Same variables as the env file (django.env.j2): the settings module
  # requires all of them in production, e.g. PROXMOX_* on the orchestrator.
  environment: "{{ django_migrate_env | combine(django_extra_env) }}"
  vars:
    django_migrate_env:
      PRODUCTION: "1"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ django_secret_key }}"
      DJANGO_ALLOWED_HOSTS: "{{ django_allowed_hosts }}"
      DB_NAME: "{{ django_db_name }}"
      DB_HOST: "{{ django_db_host }}"
      DB_PORT: "{{ django_db_port | string }}"
      DB_SSLMODE: "{{ django_db_sslmode }}"
      DB_SSLROOTCERT: "{{ django_db_sslrootcert }}"
      DB_USER: "{{ django_db_user }}"
      DB_PASSWORD: "{{ django_db_password }}"
      DB_MIGRATOR_USER: "{{ postgres_migrator_name }}"
      DB_MIGRATOR_PASSWORD: "{{ postgres_migrator_password }}"

# Idempotent post-migration commands run once provisioning (e.g. the
# orchestrator's `init`: the admin account and the default competition). Same
# environment as the migrations (writes go through the migrator connection),
# so they run only where django_run_migrations is set.
- name: Run post-migration management commands
  when: django_run_migrations | bool
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py {{ item }}"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"
  no_log: "{{ hide_secrets }}"
  loop: "{{ django_post_migrate_commands }}"
  environment: "{{ django_migrate_env | combine(django_extra_env) }}"
  vars:
    django_migrate_env:
      PRODUCTION: "1"
      DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      DJANGO_SECRET_KEY: "{{ django_secret_key }}"
      DJANGO_ALLOWED_HOSTS: "{{ django_allowed_hosts }}"
      DB_NAME: "{{ django_db_name }}"
      DB_HOST: "{{ django_db_host }}"
      DB_PORT: "{{ django_db_port | string }}"
      DB_SSLMODE: "{{ django_db_sslmode }}"
      DB_SSLROOTCERT: "{{ django_db_sslrootcert }}"
      DB_USER: "{{ django_db_user }}"
      DB_PASSWORD: "{{ django_db_password }}"
      DB_MIGRATOR_USER: "{{ postgres_migrator_name }}"
      DB_MIGRATOR_PASSWORD: "{{ postgres_migrator_password }}"

- name: Install systemd service
  ansible.builtin.template:
    src: django.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Django

- name: Enable Django service
  ansible.builtin.systemd:
    name: "{{ django_app_name }}"
    enabled: true
    state: started
    daemon_reload: true

# Periodic management commands (e.g. the orchestrator's collect_topology).
# The first runs may fail until SetupDbAndDashboard.yml has granted the table
# privileges (setup_db_permissions); the timer simply retries.
- name: Install management command services
  ansible.builtin.template:
    src: django-command.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd

- name: Install management command timers
  ansible.builtin.template:
    src: django-command.timer.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd

- name: Enable management command timers
  ansible.builtin.systemd:
    name: "{{ django_app_name }}-{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ django_timers }}"
  loop_control:
    label: "{{ item.name }}"

# Long-running management commands (e.g. the orchestrator's conduct_rounds).
- name: Install management daemon services
  ansible.builtin.template:
    src: django-daemon.service.j2
    dest: "/etc/systemd/system/{{ django_app_name }}-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ django_daemons }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd

- name: Enable management daemons
  ansible.builtin.systemd:
    name: "{{ django_app_name }}-{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ django_daemons }}"
  loop_control:
    label: "{{ item.name }}"
