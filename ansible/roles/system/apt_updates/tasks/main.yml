---
# Ansible owns every package install and update (cloud-init does not touch apt
# either). Debian's own automatic runs would otherwise start at boot, hold the
# dpkg lock for minutes and stall the roles' apt tasks, or try the internet
# while access is denied.
# One step for all of them (six module calls each run before 2026-11-21), changed only when one
# was not masked yet or ran.
- name: Stop and mask the automatic apt runs
  ansible.builtin.shell: |
    set -u
    changed=0
    # apt-listchanges: hourly until it succeeds once: it downloads the changelog of every package,
    # on all VMs at the same moment, and keeps retrying with the internet denied.
    for unit in apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service \
                apt-listchanges.timer apt-listchanges.service; do
      if [ "$(systemctl is-enabled "$unit" 2>/dev/null)" = masked ] && ! systemctl is-active --quiet "$unit"; then
        continue
      fi
      systemctl stop "$unit" 2>/dev/null
      systemctl mask "$unit" || exit 1
      changed=1
    done
    # A unit masked after it had failed keeps showing as failed (`systemctl --failed`, worms-gui's
    # `fail` column): only what still fails should.
    systemctl reset-failed apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service \
      apt-listchanges.timer apt-listchanges.service 2>/dev/null || true
    echo "changed=$changed"
  register: apt_updates_masked
  changed_when: "'changed=1' in apt_updates_masked.stdout"

- name: Remove unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true
    lock_timeout: "{{ apt_updates_lock_timeout }}"

# Only while internet access is allowed. The private-internet VMs are updated by
# their roles (Site.yml), after apt_client has set their sources.
- name: Update all packages
  when:
    - internet_enabled | bool
    - "'private_internet' not in group_names"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
    lock_timeout: "{{ apt_updates_lock_timeout }}"
  # A mirror hiccup during the download fails the whole upgrade; apt resumes
  # from the packages already downloaded.
  register: apt_updates_upgrade
  retries: 2
  delay: 10
  until: apt_updates_upgrade is succeeded
