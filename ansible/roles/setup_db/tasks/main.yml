---

#
# Guarantee basic connections and variables
#

- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Gather installed PostgreSQL version
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    recurse: false
  register: postgres_versions

- name: Set PostgreSQL version fact
  ansible.builtin.set_fact:
    postgresql_version: "{{ postgres_versions.files | map(attribute='path') | map('basename') | first }}"

#
# Find PostgreSQL config paths
#

- name: Find postgresql.conf
  shell: |
    find /etc/postgresql -name postgresql.conf | head -n1
  register: postgresql_conf
  changed_when: false


- name: Find pg_hba.conf
  shell: |
    find /etc/postgresql -name pg_hba.conf | head -n1
  register: pg_hba_conf
  changed_when: false

#
# Configure PostgreSQL networking
#

- name: Allow PostgreSQL remote connections
  lineinfile:
    path: "{{ postgresql_conf.stdout }}"
    regexp: '^#?\s*listen_addresses\s*='
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
  notify: Restart PostgreSQL


- name: Allow database users remote access
  blockinfile:
    path: "{{ pg_hba_conf.stdout }}"
    marker: "# {mark} ANSIBLE DATABASE ACCESS"
    block: |
      host    {{ postgres_db }}    dbuser_select             0.0.0.0/0    scram-sha-256
      host    {{ postgres_db }}    dbuser_logging            0.0.0.0/0    scram-sha-256
      host    {{ postgres_db }}    dbuser_scoring            0.0.0.0/0    scram-sha-256
      host    {{ postgres_db }}    dbuser_network_monitor    0.0.0.0/0    scram-sha-256
  notify: Restart PostgreSQL

#
# Database creation
#

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    state: present
  become_user: postgres

- name: Flush handlers before creating users
  meta: flush_handlers

#
# Users
#
- name: Create PostgreSQL users
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_user: postgres
    login_unix_socket: /var/run/postgresql
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: LOGIN
    encrypted: true
  loop: "{{ postgresql_users }}"

#
# Create table
#

- name: Create data table
  community.postgresql.postgresql_query:
    db: "{{ postgres_db }}"
    query: |
      CREATE TABLE IF NOT EXISTS data (
          id SERIAL PRIMARY KEY,
          payload TEXT NOT NULL
      );
  become_user: postgres


#
# Database permissions
#

- name: Grant database CONNECT
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item.name }}"
    type: database
    privs: CONNECT
    state: present
  loop: "{{ postgresql_users }}"
  become_user: postgres


- name: Grant schema usage
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item.name }}"
    objs: public
    type: schema
    privs: USAGE
    state: present
  loop: "{{ postgresql_users }}"
  become_user: postgres


- name: Grant SELECT permission
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: dbuser_select
    objs: data
    type: table
    privs: SELECT
    state: present
  become_user: postgres


- name: Grant INSERT permission
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item }}"
    objs: data
    type: table
    privs: INSERT
    state: present
  loop:
    - dbuser_logging
    - dbuser_network_monitor
    - dbuser_scoring
  become_user: postgres


- name: Grant sequence usage for inserts
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db }}"
    roles: "{{ item }}"
    objs: data_id_seq
    type: sequence
    privs: USAGE
    state: present
  loop:
    - dbuser_logging
    - dbuser_network_monitor
    - dbuser_scoring
  become_user: postgres