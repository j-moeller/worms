---
# Table privileges per database role, applied AFTER the Django migrations
# (the migrator creates and owns every table). Least privilege: each role gets
# exactly these grants; anything else it holds on tables or sequences in the
# public schema is revoked (one transaction, so there is no window without
# privileges). Connecting (CONNECT, schema USAGE) is set up by setup_db_base.
#
# privs: a privilege list, optionally per column, e.g. "UPDATE (last_login)".
# tables: table names, or ALL for every table in the schema.
# Sequences of tables with INSERT are granted automatically (USAGE).
postgresql_table_privileges:
  # Public facing: read-only, except what a logged-in user does.
  django_dashboard:
    - privs: SELECT
      tables: ALL
    # Upload a worm (dashboard/views/uploads.py).
    - privs: INSERT
      tables: [uploads, malware_artifacts]
    # Create and revoke team access tokens (dashboard/views/access.py).
    - privs: INSERT
      tables: [access_tokens]
    - privs: UPDATE (revoked, revoked_at)
      tables: [access_tokens]
    # Login and sessions (django.contrib.auth / sessions).
    - privs: UPDATE (last_login)
      tables: [users]
    # First-login password change for students (dashboard/views/password.py):
    # set their own password and clear the one-time flag. Also a staff reset
    # to a new one-time password (core/accounts.py).
    - privs: UPDATE (password, must_change_password)
      tables: [users]
    # The record of those staff resets. Append only: no UPDATE or DELETE, so
    # even a compromised dashboard cannot change or remove a row.
    - privs: INSERT
      tables: [password_resets]
    - privs: INSERT, UPDATE, DELETE
      tables: [django_session]
    # Students join and leave teams during registration (dashboard/views/teams.py);
    # staff add and remove members (dashboard/views/staff_teams.py).
    - privs: INSERT, DELETE
      tables: [team_memberships]
    # Devbox: teams add/remove their own SSH keys (docs/04-dev-environment.md); a member
    # removed from a team loses theirs.
    - privs: INSERT, DELETE
      tables: [devbox_ssh_keys]
    # Staff administration on the dashboard (dashboard/views/staff*.py,
    # docs/07-security.md): student accounts, teams, the competition's
    # registration window and development competition, rounds. Column-scoped:
    # username, is_staff and is_superuser are never updated here, and the
    # accounts it inserts can be neither (postgresql_account_guard_roles);
    # staff accounts are made on the console (`worms admin create-staff`).
    # Teams and rounds are deleted only while nothing refers to them (the
    # foreign keys refuse it otherwise; no cascade rights).
    - privs: INSERT
      tables: [users]
    - privs: UPDATE (first_name, last_name, email, is_active)
      tables: [users]
    - privs: INSERT, DELETE
      tables: [teams]
    - privs: UPDATE (name, max_members, development_competition_id)
      tables: [teams]
    - privs: INSERT
      tables: [competitions]
    - privs: UPDATE (name, registration_starts_at, registration_ends_at, development_competition_id)
      tables: [competitions]
    - privs: INSERT, DELETE
      tables: [rounds]
    # A round names its gameplan by file only (docs/05-live-environment.md); editing one clears the
    # orchestrator's check of it (gameplan_status), which the orchestrator then redoes.
    - privs: UPDATE (name, seed, round_start, round_end, gameplan, team_duration, gameplan_status)
      tables: [rounds]

  # Reads competition/round/team/upload/VM state; writes only its own results.
  django_orchestrator:
    - privs: SELECT
      tables: ALL
    # manage.py collect_topology (update_or_create).
    - privs: INSERT, UPDATE
      tables: [topology_snapshots]
    # Round orchestration (orchestrator/rounds, docs/05-live-environment.md): runs (attempts) and the
    # sandbox VMs they register; host jobs are only requested. The gameplans it and the
    # node hold (file names, valid or not) and its check of each round's gameplan.
    - privs: INSERT, UPDATE
      tables: [round_runs, virtual_machines]
    - privs: INSERT, UPDATE, DELETE
      tables: [gameplans]
    - privs: UPDATE (gameplan_status, gameplan_checked_at)
      tables: [rounds]
    - privs: INSERT
      tables: [host_jobs, run_events]
    # Processing of the sandbox APIs' attempts into captures / logs.
    - privs: UPDATE (processed, processed_at)
      tables: [flag_capture_attempts, logging_attempts]
    - privs: INSERT
      tables: [flag_captures, logging]
    # Devbox (docs/04-dev-environment.md): register each team's devbox and its VMs, bump
    # the version on reset, and record devbox captures / logs.
    - privs: INSERT, UPDATE
      tables: [devboxes, devbox_vms]
    - privs: UPDATE (devbox_version)
      tables: [teams]
    - privs: INSERT
      tables: [devbox_captures, devbox_logs]
    # Uploads made in the dev view (orchestrator/rounds/devbox_runs.py).
    - privs: INSERT, UPDATE
      tables: [devbox_runs]

  # Sandbox-facing APIs (roles/applications/sandbox_api): append one attempt,
  # recording the running team's uuid (the round agent tells them which team
  # runs; no access token is used anymore). No other table, not even the
  # attempts they wrote, and no access_tokens at all. Only the columns
  # sandbox_api/files/app.py inserts (INSERT constant).
  dbuser_scoring:
    - privs: INSERT (team_uuid, vm_flag_hash, devbox)
      tables: [flag_capture_attempts]

  dbuser_logging:
    - privs: INSERT (uuid, team_uuid, log_data, devbox)
      tables: [logging_attempts]

  # Network monitor (roles/applications/network_monitor, zeek_shipper.py):
  # append flows and events; it cannot read anything, not even what it wrote.
  # network_flows is inserted with ON CONFLICT DO NOTHING (unique uid), which
  # needs no SELECT.
  dbuser_network_monitor:
    - privs: >-
        INSERT (uid, community_id, ts, duration, src_ip, src_port, dst_ip,
        dst_port, src_mac, dst_mac, transport, service, src_bytes, dst_bytes,
        src_pkts, dst_pkts, src_ip_bytes, dst_ip_bytes, missed_bytes,
        conn_state, history)
      tables: [network_flows]
    - privs: INSERT (log, ts, uid, data)
      tables: [network_events]

  # Round agent on the Proxmox host (ansible/roles/host/round_agent): reads
  # the jobs the orchestrator requested and writes their state and results.
  # Nothing else: everything it needs is in the job (validated by the agent),
  # and what it produces goes back through the job's result.
  round_agent:
    - privs: SELECT
      tables: [host_jobs]
    - privs: UPDATE (state, started_at, heartbeat_at, finished_at, result, error)
      tables: [host_jobs]

  # The event tables (core/models/events.py, docs/06-background-processes.md): each writing
  # component has an account of its own, used for nothing else. It may INSERT
  # only into its component's tables and only the columns it fills: created_at
  # and written_by (current_user) are the database's, so no row is backdated or
  # claims another writer. Nobody reads them but the admin (`worms audit`).
  dbuser_events_dashboard:
    - privs: INSERT (outcome, user_uuid, username, client_ip, not_recorded_before)
      tables: [login_events]
    - privs: >-
        INSERT (kind, actor_uuid, actor_username, client_ip, target_uuid,
        target_username, target_role, one_time_password_replaced)
      tables: [password_events]
    - privs: INSERT (kind, actor_uuid, actor_username, client_ip, target_uuid, target_username)
      tables: [impersonation_events]
    - privs: INSERT (kind, actor_uuid, actor_username, client_ip, target_uuid, target_username, detail)
      tables: [account_events]
    - privs: >-
        INSERT (kind, actor_uuid, actor_username, client_ip, team_uuid, team_name,
        target_uuid, target_username)
      tables: [team_events]
    - privs: >-
        INSERT (kind, actor_uuid, actor_username, client_ip, team_uuid, team_name,
        name, ssh_fingerprint)
      tables: [credential_events]
    - privs: INSERT (kind, actor_uuid, actor_username, client_ip, round_id, detail)
      tables: [competition_events]

  dbuser_events_node:
    - privs: INSERT (logged_in_at, gateway_user, key_type, ssh_fingerprint, client_ip, gateway_peer_port)
      tables: [ssh_gateway_logins]
    - privs: INSERT (kind, actor, detail)
      tables: [platform_events]

# Append only for every service: whatever `tables: ALL` gave, no role reads,
# changes or removes a row of these (the event tables).
postgresql_append_only_tables:
  - login_events
  - password_events
  - impersonation_events
  - account_events
  - team_events
  - credential_events
  - competition_events
  - ssh_gateway_logins
  - platform_events

# Roles whose INSERT into users is refused when the row is staff or superuser
# (a trigger, privileges.sql.j2): the public dashboard creates student
# accounts only, even if it is compromised.
postgresql_account_guard_roles: [django_dashboard]

# The roles' table, column and sequence privileges as one sorted list; compared
# before and after the grants to report "changed" only on a real change.
db_privileges_query: >-
  SELECT coalesce(string_agg(p, ',' ORDER BY p), '') AS privileges FROM (
    SELECT grantee || ':' || table_name || ':' || privilege_type AS p
      FROM information_schema.role_table_grants
      WHERE table_schema = 'public' AND grantee::text = ANY(%(roles)s::text[])
    UNION ALL
    SELECT grantee || ':' || table_name || '.' || column_name || ':' || privilege_type
      FROM information_schema.column_privileges
      WHERE table_schema = 'public' AND grantee::text = ANY(%(roles)s::text[])
    UNION ALL
    SELECT r.rolname || ':' || c.relname || ':' || a.privilege_type
      FROM pg_class c
      CROSS JOIN LATERAL aclexplode(c.relacl) a
      JOIN pg_roles r ON r.oid = a.grantee
      WHERE c.relkind = 'S' AND c.relnamespace = 'public'::regnamespace
        AND r.rolname::text = ANY(%(roles)s::text[])
  ) privileges
