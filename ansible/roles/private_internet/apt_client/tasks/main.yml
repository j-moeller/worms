---
- name: Route apt through apt-cacher-ng (path-style; non-free enabled)
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: '0644'
  register: apt_client_sources

- name: Remove any apt CONNECT proxy (path-style needs none; it breaks HTTPS caching)
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/01proxy
    state: absent

# Offline the cache serves the index it fetched in the last internet window, and
# trixie-updates/-security expire 7 days after their Date (Valid-Until): from then
# on `apt update` fails on every VM, and with it every devbox build, reset and key
# change. Signatures are still checked; only the age limit is lifted.
- name: Accept the cache's index however old it is (offline, the cache cannot refresh it)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99worms-offline-cache
    content: |
      // Managed by Ansible (role apt_client): the private apt cache is offline.
      Acquire::Check-Valid-Until "false";
      // Do not fetch translated package descriptions. They are useless to an
      // automated VM, the cache does not seed them, and `apt update` through
      // python-apt (ansible.builtin.apt) raises FetchFailedException on the
      // first one it cannot fetch -- which would fail every fresh devbox build,
      // reset and key change even though the real indexes are fine.
      Acquire::Languages "none";
    owner: root
    group: root
    mode: '0644'
  when: apt_client_use_cache | bool

# The apt tasks after this use cache_valid_time, which looks only at the age of
# the index, not at whether the sources changed. The apt-cache VM refreshed its
# index minutes ago, before this role rewrote its sources, so without a refresh
# here it would know no packages at all ("No package matching ...").
# Also when an index of these sources is missing: a refresh that failed once (the
# cache unreachable or without its index) left the sources rewritten but the index
# empty, and the next run, seeing nothing changed, never tried again ("No package
# matching 'nftables'" on every devbox gateway). A failing refresh now says so.
- name: Find the index of these sources (one InRelease list per suite)
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "{{ apt_client_mirror | regex_replace('^https?://', '') | replace('/', '_') }}_debian_dists_*_InRelease"
  register: apt_client_lists

- name: Refresh the package index from the new sources
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0  # the sources just changed, or their index is missing: however recent it is
  when:
    - apt_client_sources is changed or apt_client_lists.matched < (apt_client_suites.split() | length)
    - internet_enabled | bool or apt_client_refresh_offline | bool
