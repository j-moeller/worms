#   notify:
#     - Restart Django

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ django_source_dir }}/requirements.txt"
    virtualenv: "{{ django_venv_dir }}"
  become_user: "{{ django_app_user }}"
  notify:
    - Restart Django

- name: Run Django migrations
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py migrate --noinput"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"

- name: Collect Django static files
  ansible.builtin.command:
    cmd: "{{ django_venv_dir }}/bin/python manage.py collectstatic --noinput"
    chdir: "{{ django_source_dir }}"
  become_user: "{{ django_app_user }}"