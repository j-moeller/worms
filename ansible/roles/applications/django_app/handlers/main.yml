---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Django
  ansible.builtin.systemd:
    name: "{{ django_app_name }}"
    state: restarted
    daemon_reload: true

- name: Restart Django management daemons
  listen: Restart Django
  ansible.builtin.systemd:
    name: "{{ django_app_name }}-{{ item.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ django_daemons }}"
  loop_control:
    label: "{{ item.name }}"

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted

# setup.yml's: the restart is due, once start.yml has migrated (a later play of Site.yml).
- name: Restart Django after the migrations
  ansible.builtin.set_fact:
    django_restart_due: true
