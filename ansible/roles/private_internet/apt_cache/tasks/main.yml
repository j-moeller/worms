---
# This VM's own apt fetches from the Debian mirrors directly (apt_client, first in
# Site.yml), as every VM's but the sandbox and devbox ones: apt-cacher-ng and its
# updates come from there, while the internet is open. Only the seed and its check go through the
# cache, by the clients' sources (apt_cache_client_dir, below).

# The disks may have grown (OpenTofu: disk_size, data_disk_size).
- name: Grow the partitions and file systems to their disks
  ansible.builtin.include_role:
    name: grow_disks

# The package starts the service as soon as it is configured, and the service
# exits if it cannot write its cache dir, which fails the install. The data disk
# is mounted there root-owned, so the dir has to change owner before the install,
# and the user has to exist before that (the package accepts an existing one).
- name: Create the apt-cacher-ng group
  ansible.builtin.group:
    name: apt-cacher-ng
    system: true

- name: Create the apt-cacher-ng user
  ansible.builtin.user:
    name: apt-cacher-ng
    group: apt-cacher-ng
    system: true
    home: "{{ apt_cache_cache_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Ensure apt-cacher-ng owns its cache dir (data disk is mounted root-owned)
  ansible.builtin.file:
    path: "{{ apt_cache_cache_dir }}"
    state: directory
    owner: apt-cacher-ng
    group: apt-cacher-ng
  notify: Restart apt-cacher-ng

- name: Install apt-cacher-ng
  ansible.builtin.apt:
    name: [apt-cacher-ng, ca-certificates]
    state: present
    update_cache: "{{ internet_enabled | bool }}"
    cache_valid_time: "{{ 3600 if internet_enabled | bool else omit }}"

- name: Configure apt-cacher-ng port
  ansible.builtin.lineinfile:
    path: /etc/apt-cacher-ng/acng.conf
    regexp: '^Port:'
    line: "Port: {{ apt_cache_port }}"
  notify: Restart apt-cacher-ng

- name: Ensure no apt-cacher-ng upstream proxy (direct fetch; egress is controlled at the host)
  ansible.builtin.lineinfile:
    path: /etc/apt-cacher-ng/acng.conf
    regexp: '^Proxy:'
    state: absent
  notify: Restart apt-cacher-ng

- name: Set apt-cacher-ng offline mode flag
  ansible.builtin.lineinfile:
    path: /etc/apt-cacher-ng/acng.conf
    regexp: '^Offlinemode:'
    line: "Offlinemode: {{ 0 if (internet_enabled | bool) else 1 }}"
  notify: Restart apt-cacher-ng

- name: Create the apt-cacher-ng systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-cacher-ng.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the apt-cacher-ng hardening drop-in
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/systemd/system/apt-cacher-ng.service.d/hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart apt-cacher-ng

- name: Enable and start apt-cacher-ng
  ansible.builtin.systemd:
    name: apt-cacher-ng
    enabled: true
    state: started
    daemon_reload: true

# What a sandbox or devbox VM asks the cache for (its sources: role apt_client, group_vars/
# untrusted.yml), here through 127.0.0.1. Outside /etc/apt: this VM's own apt never reads it; the
# seed, the check and scripts/apt-cache-offline-index.py pass it (apt_cache_client_options).
- name: Create the clients' sources directory (and an empty sources.list.d)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ apt_cache_client_dir }}"
    - "{{ apt_cache_client_dir }}/sources.list.d"
    - "{{ apt_cache_client_lists }}"

- name: Write the clients' sources
  ansible.builtin.copy:
    dest: "{{ apt_cache_client_dir }}/sources.list"
    content: |
      # Managed by Ansible (role apt_cache). What a sandbox or devbox VM asks this cache for, for the
      # seed and its check. Not this VM's own apt, which fetches from the Debian mirrors directly.
      {% for suite in apt_cache_suites %}
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://127.0.0.1:{{ apt_cache_port }}/deb.debian.org/debian {{ suite }} {{ apt_cache_components }}
      {% endfor %}
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://127.0.0.1:{{ apt_cache_port }}/deb.debian.org/debian-security {{ apt_cache_security_suite }} {{ apt_cache_components }}
    owner: root
    group: root
    mode: "0644"
