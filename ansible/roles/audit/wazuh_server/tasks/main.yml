---
# Installs Wazuh all-in-one once (needs internet access: packages.wazuh.com).
# The generated passwords end up in /root/wazuh-install-files.tar.
- name: Install the installer's prerequisites
  ansible.builtin.apt:
    name: [curl, gnupg, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download the Wazuh installation assistant
  ansible.builtin.get_url:
    url: "https://packages.wazuh.com/{{ wazuh_version }}/wazuh-install.sh"
    dest: /root/wazuh-install.sh
    mode: "0700"

# The installer runs 20-40 min with no output of its own on stdout, so run it
# asynchronously and poll: the run then prints a heartbeat every
# wazuh_install_poll_seconds instead of hanging silently on one task. For live
# detail, tail the installer's log on the VM (see below).
- name: Note how to watch the Wazuh install
  ansible.builtin.debug:
    msg: >-
      Installing Wazuh (manager, indexer, dashboard) -- takes ~20-40 min.
      Live log:  ssh {{ ansible_host | default(inventory_hostname) }}
      sudo tail -f /var/log/wazuh-install.log

- name: Install Wazuh (manager, indexer, dashboard)
  ansible.builtin.command:
    cmd: bash /root/wazuh-install.sh {{ wazuh_install_args }}
    chdir: /root
    creates: /var/ossec/bin/wazuh-control
  async: "{{ wazuh_install_timeout }}"
  poll: 0
  register: wazuh_install

# Skipped (ansible_job_id undefined) when the install was a no-op (creates:).
- name: Wait for the Wazuh installer to finish (heartbeat every {{ wazuh_install_poll_seconds }}s)
  ansible.builtin.async_status:
    jid: "{{ wazuh_install.ansible_job_id }}"
  register: wazuh_job
  until: wazuh_job.finished
  retries: "{{ ((wazuh_install_timeout | int) / (wazuh_install_poll_seconds | int)) | round(0, 'ceil') | int }}"
  delay: "{{ wazuh_install_poll_seconds }}"
  when: wazuh_install.ansible_job_id is defined

# Only after the installer: it refuses to run if /etc/wazuh-indexer exists.
# Overrides the heap in jvm.options (read last).
- name: Limit the indexer heap
  ansible.builtin.copy:
    dest: /etc/wazuh-indexer/jvm.options.d/worms-heap.options
    content: |
      -Xms{{ wazuh_indexer_heap }}
      -Xmx{{ wazuh_indexer_heap }}
    owner: root
    group: wazuh-indexer
    mode: "0640"
  notify: Restart wazuh-indexer

# Receive the audit logs of the infrastructure VMs as syslog.
- name: Listen for syslog
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} worms: syslog from the infrastructure VMs (Ansible) -->"
    insertbefore: "</ossec_config>"
    block: |
      <remote>
        <connection>syslog</connection>
        <port>{{ wazuh_syslog_port }}</port>
        <protocol>tcp</protocol>
        <local_ip>{{ infrastructure_ips.wazuh }}</local_ip>
      {% for cidr in wazuh_syslog_allowed %}
        <allowed-ips>{{ cidr }}</allowed-ips>
      {% endfor %}
      </remote>
  notify: Restart wazuh-manager

# Keep every event, not only those that match an alert rule, so all logs can
# be searched in the dashboard (index pattern wazuh-archives-*).
- name: Archive all events
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: "<logall_json>no</logall_json>"
    replace: "<logall_json>yes</logall_json>"
  notify: Restart wazuh-manager

- name: Index the archived events
  ansible.builtin.replace:
    path: /etc/filebeat/filebeat.yml
    regexp: '(archives:\s*\n\s*enabled:\s*)false'
    replace: '\1true'
  notify: Restart filebeat
