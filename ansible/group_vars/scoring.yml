---
# Scoring VM (OpenTofu: infrastructure/ephemeral, key scoring).
tls_dns_name: scoring.worms.internal
# Wildcard so a devbox can reach <team>.scoring.worms.internal over verified
# HTTPS (docs/devbox.md); attribution is still by source address.
tls_extra_sans:
  - "DNS:*.scoring.worms.internal"

# Sandbox-facing REST API: INSERT-only database role (+ SELECT on the access
# token hashes for validation).
sandbox_api_kind: scoring
sandbox_api_db_user: dbuser_scoring
sandbox_api_db_password: "{{ vault_dbuser_scoring_password }}"
sandbox_api_max_body_bytes: 2048
