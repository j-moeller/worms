---
# Private-internet services. VMs are spun up by opentofu/stacks/private_internet
# (cloud-init: first boot only); this playbook installs and configures them
# over the mgmt-exposed management network (management addresses).
#
# DNS is configured separately by SetupDNS.yml (setup_dns role).
# The mode follows the host state (internet_enabled in group_vars/all.yml):
# `make` runs it while internet is allowed to populate the caches (online
# mode), and again after denying it to switch them to offline mode.

# First every private-internet VM's apt, the cache's own included, at the Debian mirrors: they
# install their packages from there while the internet is open, as every VM does but the sandbox
# and devbox ones, which alone go through the cache (group_vars/untrusted.yml). This also takes a
# VM that went through the cache before (they all did) back to the mirrors.
- hosts: private_internet
  any_errors_fatal: true
  become: true
  pre_tasks:
    - name: Wait for cloud-init to finish (tolerate errors; roles ensure packages)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
  roles:
    - apt_client

- hosts: apt_cache_hosts
  any_errors_fatal: true
  become: true
  pre_tasks:
    - name: Wait for cloud-init to finish (tolerate errors; roles ensure packages)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
  roles:
    - apt_cache

- hosts: apt_cache_hosts
  any_errors_fatal: true
  become: true
  tasks:
    - name: Fill the cache while the internet is open
      ansible.builtin.include_role:
        name: apt_cache
        tasks_from: seed
      when: internet_enabled | bool

- hosts: devpi_hosts
  any_errors_fatal: true
